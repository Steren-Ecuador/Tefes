<style>/* bx4: Todos los pendientes como Gmail, en compu y celular (Diego 20-nov) */
#vista{display:none!important}
.bx4{display:grid;grid-template-columns:190px minmax(0,1fr);gap:14px;align-items:start}
.bx4-nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:8px}
.bx4-nav button{display:flex;align-items:center;gap:10px;border:0;background:none;font:inherit;font-size:14px;color:var(--fg);padding:8px 14px;border-radius:0 999px 999px 0;cursor:pointer;text-align:left}
.bx4-nav button:hover{background:var(--surface-2)}
.bx4-nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.bx4-nav i{font-style:normal;width:18px;text-align:center}.bx4-nav span{flex:1}.bx4-nav b{font-size:12.5px;font-weight:700}
.bx4-box{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);min-width:0}
.bx4-bar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--fg-3)}
.bx4-bar b{color:var(--fg);font-size:14px}.bx4-bar span{margin-left:auto}
.bx4-r{display:grid;grid-template-columns:10px 170px minmax(0,1fr) auto;gap:12px;align-items:center;padding:0 14px;height:42px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;background:var(--surface-2)}
.bx4-r.nv{background:var(--surface)}
.bx4-r:hover{box-shadow:inset 1px 0 0 var(--line),inset -1px 0 0 var(--line),0 1px 3px rgba(0,0,0,.18);position:relative;z-index:1}
.bx4-r:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.bx4-dot{width:8px;height:8px;border-radius:50%;background:transparent}.bx4-r.nv .bx4-dot{background:var(--accent)}
.bx4-de{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}.bx4-r.nv .bx4-de{font-weight:700}
.bx4-as{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg-3)}
.bx4-as b{color:var(--fg);font-weight:500}.bx4-r.nv .bx4-as b{font-weight:700}
.bx4-tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:6px;background:var(--na-soft);color:var(--fg-3);margin-right:6px;vertical-align:1px}
.bx4-tag.alta{background:var(--bad-soft);color:var(--bad)}
.bx4-av{display:none}
.bx4-der{display:flex;align-items:center;justify-content:flex-end;gap:6px;min-width:84px}
.bx4-f{font-size:12.5px;color:var(--fg-3);white-space:nowrap}.bx4-r.nv .bx4-f{color:var(--fg);font-weight:700}.bx4-f.venc{color:var(--bad)!important}
.bx4-acc{display:flex;gap:6px}
.bx4-acc button{font:inherit;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;white-space:nowrap}
.bx4-acc button.ok{background:var(--good);border-color:transparent;color:#fff}.bx4-acc button:disabled{opacity:.6;cursor:default}
@media(hover:hover) and (min-width:701px){.bx4-r .bx4-acc{display:none}.bx4-r:hover .bx4-acc{display:flex}.bx4-r:hover .bx4-f{display:none}}
.bx4-mas{display:block;width:100%;padding:11px;border:0;background:var(--surface);font:inherit;font-weight:600;color:var(--accent);cursor:pointer}
.bx4-vac{padding:40px 16px;text-align:center;color:var(--fg-3)}
@media(max-width:900px){.bx4{grid-template-columns:1fr}.bx4-nav{flex-direction:row;overflow-x:auto;position:static;gap:6px;padding-bottom:2px;scrollbar-width:none}
 .bx4-nav button{border-radius:999px;border:1px solid var(--line);padding:6px 12px;white-space:nowrap;flex:none;font-size:13.5px}.bx4-nav button.on{border-color:transparent}}
@media(max-width:700px){
 .bx4-box{border-radius:10px}.bx4-bar{padding:8px 12px}
 .bx4-r{grid-template-columns:40px minmax(0,1fr) auto;grid-template-rows:auto auto auto;height:auto;padding:10px 12px;row-gap:1px;column-gap:12px;align-items:start}
 .bx4-dot{display:none}
 .bx4-av{display:flex;grid-row:1 / 4;width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);align-items:center;justify-content:center;font-weight:700;font-size:14px}
 .bx4-r:not(.nv) .bx4-av{background:var(--na)}
 .bx4-de{grid-column:2;grid-row:1}.bx4-der{display:contents}.bx4-f{grid-column:3;grid-row:1;text-align:right}
 .bx4-as{grid-column:2 / 4;grid-row:2;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
 .bx4-acc{grid-column:2 / 4;grid-row:3;margin-top:6px}.bx4-acc button{padding:7px 14px;font-size:13.5px}
}
/* el pendiente se abre en toda la pantalla, como un correo */
body.bx4-lee #drawer .drawer-bg{background:var(--bg);justify-content:center}
body.bx4-lee #drawer .drawer{width:min(900px,100%);box-shadow:0 0 0 1px var(--line)}
body.bx4-lee #drawer .d-top{flex-direction:row}
body.bx4-lee #drawer .d-x{order:-1;background:none;font-size:22px;line-height:1;padding:6px 10px}
</style>
<script>/* bx4: bandeja tipo Gmail para Todos los pendientes. Carpetas a la izquierda (arriba en el celular),
   filas de una línea, ✓ Validar rápido al pasar el mouse y el pendiente se abre en toda la pantalla. */
(function(){
  window.bx4Abrir = id => { document.body.classList.add('bx4-lee'); (window.__bx4C || window).detalle(id);
    const x = document.querySelector('#drawer .d-x'); if (x) { x.textContent = '←'; x.title = 'Volver a la bandeja'; x.setAttribute('aria-label', 'Volver a la bandeja'); }
    const d = document.querySelector('#drawer .drawer'); if (d) d.scrollTop = 0; };
  const dw = document.getElementById('drawer');
  if (dw) new MutationObserver(() => { if (!dw.firstElementChild) document.body.classList.remove('bx4-lee'); }).observe(dw, {childList: true});
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('bx4-lee') && dw) dw.innerHTML = ''; });
})();
window.bx2Pend = function(base, hoy, E, chips, bind, C){
  C = C || window;   /* en el panel de supervisores st, detalle, etc. no son globales: llegan en C */
  const {st, $, dias, fmtF, esc, ABIERTOS, guardarEstado, renderPend} = C, puede = C.puede; window.__bx4C = C;
  const F = {validar: ['📥', 'Por validar'], abiertos: ['📂', 'Abiertos'], vencidos: ['⏰', 'Vencidos'], cerrados: ['✅', 'Cerrados'], todos: ['🗂️', 'Todos']};
  if (!F[st.bxF]) st.bxF = 'validar';
  const fil = k => base.filter(E[k][1]);
  $('#fEstado').innerHTML = chips || ''; if (bind) bind();
  const s = (a, b) => String(a || '').localeCompare(String(b || ''));
  const ord = {validar: (a, b) => s(b.fres, a.fres), abiertos: (a, b) => s(a.fcomp || '9', b.fcomp || '9'), vencidos: (a, b) => s(a.fcomp, b.fcomp),
    cerrados: (a, b) => s(b.fcierre, a.fcierre), todos: (a, b) => s(b.id, a.id)}[st.bxF];
  const L = fil(st.bxF).sort(ord), max = st.bxMax || 50, V = L.slice(0, max);
  $('#pcount').textContent = '';
  const fch = f => !f ? '' : f === hoy ? 'Hoy' : dias(f, hoy) === 1 ? 'Ayer' : fmtF(f).replace(/ 20\d\d$/, '');
  const puedo = p => typeof puede !== 'function' || puede(p);
  const fecha = p => { const venc = ABIERTOS.includes(p.estado) && p.fcomp && p.fcomp < hoy;
    const f = p.estado === 'Por validar' ? fch(p.fres) : p.estado === 'Cerrado' ? fch(p.fcierre) : fch(p.fcomp) || 'Sin fecha';
    return `<span class="bx4-f${venc ? ' venc' : ''}" title="${p.estado === 'Por validar' ? 'Respondió' : p.estado === 'Cerrado' ? 'Cerrado' : venc ? 'Venció' : 'Vence'}">${esc(f)}</span>`; };
  const resumen = p => p.estado === 'Por validar' ? (p.comT || 'Respondió sin comentario') + (p.fotoD && p.fotoD.length ? ' · 📷 ' + p.fotoD.length : '')
    : p.estado === 'Cerrado' ? (p.comS || p.accion || '') : (p.accion || p.texto || '');
  const ini = t => String(t || '?').replace(/[^\p{L}\s]/gu, ' ').trim().split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') || '?';
  const nav = `<nav class="bx4-nav" aria-label="Carpetas">${Object.keys(F).map(k => { const n = fil(k).length;
    return `<button class="${st.bxF === k ? 'on' : ''}" data-bx="${k}"><i>${F[k][0]}</i><span>${F[k][1]}</span><b>${k === 'cerrados' || k === 'todos' ? '' : n || ''}</b></button>`; }).join('')}</nav>`;
  const filas = !L.length ? `<div class="bx4-vac">${st.bxF === 'validar' ? '🎉 Nada espera validación. Bandeja al día.' : 'No hay pendientes aquí con estos filtros.'}</div>` :
    V.map(p => `<div class="bx4-r${p.estado === 'Por validar' ? ' nv' : ''}" role="button" tabindex="0" data-id="${esc(p.id)}">
      <span class="bx4-dot" aria-hidden="true"></span><span class="bx4-av" aria-hidden="true">${esc(ini(p.tienda))}</span>
      <div class="bx4-de" title="${esc(p.resp || '')}">${esc(p.tienda)}</div>
      <div class="bx4-as"><span class="bx4-tag${p.prior === 'Alta' ? ' alta' : ''}">${esc(p.punto || p.id)}</span><b>${esc(p.hallazgo || p.texto || p.punto)}</b> – ${esc(resumen(p))}</div>
      <div class="bx4-der">${fecha(p)}${p.estado === 'Por validar' && puedo(p) ? `<span class="bx4-acc"><button class="ok" data-ok="${esc(p.id)}" title="La corrección está bien: se cierra">✓ Validar</button><button data-ab="${esc(p.id)}">Abrir</button></span>` : ''}</div>
    </div>`).join('') + (L.length > max ? `<button class="bx4-mas" id="bx4Mas">Ver ${Math.min(50, L.length - max)} más</button>` : '');
  $('#plist').innerHTML = `<div class="bx4">${nav}<div class="bx4-box"><div class="bx4-bar"><b>${F[st.bxF][1]}</b><span>${L.length ? (V.length < L.length ? '1–' + V.length + ' de ' : '') + L.length : ''}</span></div>${filas}</div></div>`;
  $('#plist').querySelectorAll('.bx4-nav [data-bx]').forEach(c => c.onclick = () => { st.bxF = c.dataset.bx; st.bxMax = 50; renderPend(); });
  $('#plist').querySelectorAll('.bx4-r').forEach(r => { r.onclick = () => bx4Abrir(r.dataset.id); r.onkeydown = e => { if (e.key === 'Enter') bx4Abrir(r.dataset.id); }; });
  $('#plist').querySelectorAll('[data-ab]').forEach(b => b.onclick = e => { e.stopPropagation(); bx4Abrir(b.dataset.ab); });
  $('#plist').querySelectorAll('[data-ok]').forEach(b => b.onclick = e => { e.stopPropagation(); b.closest('.bx4-acc').querySelectorAll('button').forEach(x => x.disabled = true); guardarEstado(b.dataset.ok, 'Cerrado', '', b); });
  const m = $('#bx4Mas'); if (m) m.onclick = () => { st.bxMax = max + 50; renderPend(); };
};
</script>
