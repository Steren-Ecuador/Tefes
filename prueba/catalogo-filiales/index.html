<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Catálogo Steren para colaboradores</title>
<meta name="description" content="Productos Steren con precio especial para colaboradores. Precios incluyen IVA.">
<meta name="theme-color" content="#000000">
<style>
:root{--bg:#000;--fg:#fff;--muted:rgba(255,255,255,.72);--chip:rgba(255,255,255,.14);--accent:#ffd400;--accent-fg:#111;--card:#fff;--hd:calc(env(safe-area-inset-top) + 92px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{overflow:hidden}
.app{position:relative;height:100%;max-width:480px;margin:0 auto;background:#000;overflow:hidden}
@media(min-width:520px){.app{border-left:1px solid #222;border-right:1px solid #222}}
/* Encabezado fijo */
.top{position:absolute;top:0;left:0;right:0;z-index:20;height:var(--hd);padding-top:calc(env(safe-area-inset-top) + 8px);background:#000}
.brand{display:flex;align-items:center;justify-content:center;gap:8px;height:34px}
.brand img{height:26px;width:auto}
.brand b{font-size:22px;font-weight:800;letter-spacing:.3px}
.brand span{font-size:12px;color:var(--muted);font-weight:600;border-left:1px solid #fff4;padding-left:8px;line-height:1.15}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:var(--chip);color:var(--fg);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--fg);color:#000}
/* Feed vertical */
.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
.feed::-webkit-scrollbar{display:none}
.post{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;display:flex;flex-direction:column;padding-top:var(--hd)}
.bgblur{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(40px) brightness(.4) saturate(1.3);transform:scale(1.1)}
/* Zona de foto: nunca lleva texto encima */
.stage{position:relative;flex:1 1 auto;min-height:0;container-type:size;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px 0 4px}
.card{position:relative;width:min(86vw,46vh,400px);width:min(100cqw - 32px,100cqh - 26px,400px);aspect-ratio:1;background:var(--card);border-radius:22px;box-shadow:0 16px 40px #0008;overflow:hidden}
.slides{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.slides::-webkit-scrollbar{display:none}
.slides img{flex:0 0 100%;width:100%;height:100%;object-fit:contain;scroll-snap-align:center;padding:4%}
.noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#555;font-weight:700;font-size:22px;padding:20px;text-align:center}
.dots{display:flex;gap:7px;height:8px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:#fff5;cursor:pointer;transition:all .2s}
.dots i.on{background:#fff;width:18px;border-radius:4px}
/* Zona de texto, debajo de la foto */
.info{position:relative;z-index:5;display:flex;gap:10px;padding:6px 10px calc(env(safe-area-inset-bottom) + 14px) 14px}
.txt{flex:1;min-width:0}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-bottom:2px}
.name{font-size:17px;font-weight:800;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.code{font-size:12px;color:var(--muted);font-weight:600;margin:2px 0 4px}
.feat{list-style:none;color:var(--muted);font-size:13.5px;line-height:1.35;max-height:2.7em;overflow:hidden}
.feat li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat li::before{content:"• ";color:var(--accent)}
.more{background:none;border:0;color:var(--fg);font-weight:700;font-size:13px;padding:2px 0 6px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.price{display:flex;align-items:stretch;gap:10px;margin-top:4px}
.pcol{background:var(--accent);color:var(--accent-fg);border-radius:12px;padding:6px 12px 7px;line-height:1}
.pcol small{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.pcol strong{font-size:30px;font-weight:900;letter-spacing:-.5px}
.pnorm{display:flex;flex-direction:column;justify-content:center;font-size:12px;color:var(--muted);line-height:1.25}
.pnorm s{font-size:16px;font-weight:700}
.pvp{font-size:26px;font-weight:900}
.iva{font-size:11.5px;color:var(--muted);margin-top:5px}
.iva b{color:var(--fg)}
.top .tb{position:absolute;top:calc(env(safe-area-inset-top) + 8px);width:34px;height:34px;border:0;background:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.top .tb svg{width:24px;height:24px}
.top .tb.l{left:8px}.top .tb.r{right:8px}
.badge{position:absolute;top:0;right:-2px;min-width:18px;height:18px;border-radius:9px;background:#25d366;color:#000;font-size:11px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 4px}
.badge.on{display:flex}
.save{color:var(--accent);font-weight:700;font-size:12px}
.wa{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:8px;border:0;border-radius:12px;background:#25d366;color:#05210f;font-weight:800;font-size:15px;padding:10px 12px;cursor:pointer}
.wa svg{width:20px;height:20px}
.act.add.on svg{stroke:#25d366}
.act.add.on span{color:#25d366}
.panel{position:absolute;inset:0;z-index:40;background:#000e;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 14px)}
.panel.on{display:flex}
.panel h2{font-size:18px;font-weight:800;margin:4px 40px 10px 0}
.panel .x{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:12px;width:34px;height:34px;border-radius:50%;border:0;background:#fff2;color:#fff;font-size:20px;cursor:pointer}
.panel input{width:100%;font-size:16px;padding:11px 14px;border-radius:12px;border:0;background:#fff;color:#000;margin-bottom:10px}
.plist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.pi{display:flex;align-items:center;gap:10px;background:#ffffff12;border-radius:12px;padding:8px;cursor:pointer;border:0;color:#fff;text-align:left;width:100%;font:inherit}
.pi img{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:8px;flex:0 0 auto}
.pi .t{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.25}
.pi .t small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.pi .p{font-weight:800;color:var(--accent);white-space:nowrap}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border-radius:50%;border:0;background:#fff2;color:#fff;font-size:16px;font-weight:800;cursor:pointer}
.qty b{min-width:18px;text-align:center}
.tot{display:flex;justify-content:space-between;font-size:16px;font-weight:800;padding:12px 2px 0;border-top:1px solid #fff3;margin-top:8px}
.tot:empty{display:none}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.rail{flex:0 0 auto;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;padding-bottom:6px}
.act{background:none;border:0;color:var(--fg);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;cursor:pointer}
.act svg{width:30px;height:30px}
.act.on svg{fill:#fe2c55;stroke:#fe2c55}
/* Ver más: panel que sí puede ir sobre la foto */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:15;max-height:78%;overflow-y:auto;background:#111e;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:20px 20px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(105%);transition:transform .28s ease}
.post.open .sheet{transform:none}
.sheet h3{font-size:18px;font-weight:800;margin:0 30px 4px 0}
.sheet .code{margin-bottom:10px}
.sheet ul{list-style:none;font-size:15px;line-height:1.4}
.sheet li{margin-bottom:8px}
.sheet li::before{content:"• ";color:var(--accent)}
.close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;border:0;background:#fff2;color:#fff;font-size:18px;cursor:pointer}
.count{position:absolute;top:calc(var(--hd) + 10px);right:12px;z-index:6;font-size:12px;color:var(--muted);font-weight:600;background:#0006;padding:2px 8px;border-radius:999px}
.hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 6px);left:50%;transform:translateX(-50%);z-index:30;font-size:12px;color:var(--muted);animation:up 1.6s ease-in-out infinite;pointer-events:none}
@keyframes up{50%{transform:translate(-50%,-6px)}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fffe;color:#000;padding:8px 14px;border-radius:10px;font-weight:600;font-size:13px;opacity:0;transition:opacity .2s;z-index:50;pointer-events:none}
.toast.on{opacity:1}
.cover .stage{padding:0 24px;text-align:center;gap:14px}
.cover .big{width:84px;height:auto}
.cover h1{font-size:30px;line-height:1.1;font-weight:900}
.cover p{color:var(--muted);font-size:15px}
.cover .ivabox{display:inline-block;background:var(--accent);color:var(--accent-fg);font-weight:800;font-size:13px;padding:5px 12px;border-radius:999px}
.cover .cats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="tb l" id="bsearch" aria-label="Buscar"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button><button class="tb r" id="bcart" aria-label="Mi pedido"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg><span class="badge" id="nbadge"></span></button><div class="brand"><img src="logo.png" alt=""><b>Steren</b><span>Catálogo para<br>colaboradores</span></div>
    <div class="chips" id="chips"></div>
  </div>
  <main class="feed" id="feed"></main>
  <div class="panel" id="psearch"><button class="x" data-close>×</button><h2>Buscar producto</h2><input id="q" type="search" placeholder="Nombre o código, ej. parlante, PB-2010AC" autocomplete="off"><div class="plist" id="sres"></div></div>
  <div class="panel" id="pcart"><button class="x" data-close>×</button><h2>Mi pedido</h2><div class="plist" id="clist"></div><div class="tot" id="ctot"></div><button class="wa" id="csend"></button></div>
  <div class="hint" id="hint">Desliza hacia arriba ↑</div>
</div>
<div class="toast" id="toast"></div>
<script src="datos.js?v=6"></script>
<script>
(function(){
var WA=''; // WhatsApp de Steren Ecuador con código de país, ej. '5939XXXXXXXX'. Vacío = el colaborador elige el chat.
var P=window.CATALOGO||[], CATS=[], byCat={}, BY={};
P.forEach(function(p){BY[p.codigo]=p;});
P.forEach(function(p){ if(!byCat[p.cat]){byCat[p.cat]=[];CATS.push(p.cat);} byCat[p.cat].push(p); });
var feed=document.getElementById('feed'), chips=document.getElementById('chips');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(n){return '$'+Number(n).toFixed(2);}
var likes={}; try{likes=JSON.parse(localStorage.getItem('cat_likes')||'{}');}catch(e){}
function saveLikes(){try{localStorage.setItem('cat_likes',JSON.stringify(likes));}catch(e){}}
var waico='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4a.5.5 0 0 0 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.2c0-.1-.2-.2-.5-.3z"/></svg>';
var cartico='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>';
var search='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>';
var cart={}; try{cart=JSON.parse(localStorage.getItem('cat_cart')||'{}');}catch(e){}
function saveCart(){try{localStorage.setItem('cat_cart',JSON.stringify(cart));}catch(e){} upd();}
var heart='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 21s-7.5-4.6-9.5-9.2C1 8.2 3.3 5 6.6 5c2 0 3.4 1.1 4.4 2.5C12 6.1 13.4 5 15.4 5 18.7 5 21 8.2 19.5 11.8 17.5 16.4 12 21 12 21z"/></svg>';
var share='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M14 5l7 7-7 7M21 12H9c-3.3 0-6 2.7-6 6v1"/></svg>';
var grid='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>';
var html=['<section class="post cover" data-cat=""><div class="bgblur" style="background:radial-gradient(circle at 30% 20%,#ffd40055,#000 60%)"></div><div class="stage"><img class="big" src="logo.png" alt=""><h1>Productos Steren<br>para ti</h1><p>'+P.length+' productos con precio especial para colaboradores. Desliza para verlos o elige una categoría.</p><span class="ivabox">Todos los precios incluyen IVA</span><div class="cats">'+CATS.map(function(c){return '<button class="chip" data-go="'+esc(c)+'">'+esc(c)+' · '+byCat[c].length+'</button>';}).join('')+'</div></div></section>'];
var n=0;
CATS.forEach(function(c){ byCat[c].forEach(function(p,i){ n++;
  var imgs=(p.imgs&&p.imgs.length)?p.imgs:(p.img?[p.img]:[]);
  var slides=imgs.length?'<div class="slides">'+imgs.map(function(u,k){return '<img '+(k?'loading="lazy" ':'')+(k===0&&p.img&&p.img!==u?'data-alt="'+esc(p.img)+'" ':'')+'src="'+esc(u)+'" alt="'+esc(p.nombre)+(k?' foto '+(k+1):'')+'">';}).join('')+'</div>':'<div class="noimg">'+esc(p.codigo)+'</div>';
  var dots=imgs.length>1?imgs.map(function(u,k){return '<i'+(k?'':' class="on"')+' data-k="'+k+'"></i>';}).join(''):'';
  var bg=imgs.length?'background-image:url(\''+esc(imgs[0])+'\')':'background:#222';
  var precio=p.colab?'<div class="pcol"><small>Precio colaborador</small><strong>'+money(p.colab)+'</strong></div><div class="pnorm">Precio normal<s>'+money(p.pvp)+'</s><span class="save">Ahorras '+money(p.pvp-p.colab)+'</span></div>':'<div class="pnorm">Precio<span class="pvp">'+money(p.pvp)+'</span></div>';
  var f=p.feat||[], feats=f.map(function(x){return '<li>'+esc(x)+'</li>';}).join('');
  html.push('<section class="post" id="p'+n+'" data-cat="'+esc(c)+'" data-i="'+(i+1)+'" data-code="'+esc(p.codigo)+'">'+
   '<div class="bgblur" style="'+bg+'"></div>'+
   '<div class="stage"><div class="card">'+slides+'</div><div class="dots">'+dots+'</div></div>'+
   '<div class="info"><div class="txt"><span class="tag">#'+esc(c.replace(/\s+/g,''))+' · '+(i+1)+' de '+byCat[c].length+'</span><div class="name">'+esc(p.nombre)+'</div><div class="code">Código '+esc(p.codigo)+'</div>'+
   (feats?'<ul class="feat">'+feats+'</ul><button class="more">Ver más</button>':'')+
   '<div class="price">'+precio+'</div><div class="iva">Precios <b>incluyen IVA</b></div><button class="wa want">'+waico+'Lo quiero</button></div>'+
   '<div class="rail"><button class="act add'+(cart[p.codigo]?' on':'')+'" aria-label="Agregar al pedido">'+cartico+'<span>'+(cart[p.codigo]?'En pedido':'Agregar')+'</span></button>'+
   '<button class="act share" aria-label="Compartir">'+share+'<span>Compartir</span></button>'+
   '<button class="act find" aria-label="Buscar">'+search+'<span>Buscar</span></button></div></div>'+
   (feats?'<div class="sheet"><button class="close" aria-label="Cerrar">×</button><h3>'+esc(p.nombre)+'</h3><div class="code">Código '+esc(p.codigo)+'</div><ul>'+feats+'</ul><div class="price">'+precio+'</div><div class="iva">Precios <b>incluyen IVA</b></div></div>':'')+
   '</section>');
 }); });
feed.innerHTML=html.join('');
chips.innerHTML=CATS.map(function(c){return '<button class="chip" data-go="'+esc(c)+'">'+esc(c)+'</button>';}).join('');
function go(c){var el=feed.querySelector('.post[data-cat="'+c.replace(/"/g,'\\"')+'"]'); if(el) el.scrollIntoView({behavior:'smooth'});}
// si una foto no carga: probar la foto principal y si no, quitarla
document.addEventListener('error',function(e){var im=e.target; if(!im||im.tagName!=='IMG'||!im.closest('.slides')) return;
  var alt=im.getAttribute('data-alt'); if(alt){im.removeAttribute('data-alt'); im.src=alt; return;}
  var s=im.parentNode, card=s.parentNode, d=card.parentNode.querySelector('.dots'), idx=[].indexOf.call(s.children,im);
  im.remove(); if(d&&d.children[idx]) d.children[idx].remove(); if(d&&d.children.length<2) d.innerHTML='';
  if(!s.children.length) card.innerHTML='<div class="noimg">'+esc(card.closest('.post').getAttribute('data-code'))+'</div>';
},true);
// puntitos del carrusel
[].forEach.call(feed.querySelectorAll('.slides'),function(s){
  var d=s.parentNode.parentNode.querySelector('.dots'); if(!d||!d.children.length) return;
  s.addEventListener('scroll',function(){var k=Math.round(s.scrollLeft/s.clientWidth); [].forEach.call(d.children,function(x,j){x.classList.toggle('on',j===k);});},{passive:true});
});
function upd(){var n=0; for(var k in cart) n+=cart[k]; var b=document.getElementById('nbadge'); b.textContent=n; b.classList.toggle('on',n>0);
  [].forEach.call(feed.querySelectorAll('.post[data-code]'),function(s){var a=s.querySelector('.add'); if(!a) return; var on=!!cart[s.getAttribute('data-code')]; a.classList.toggle('on',on); a.querySelector('span').textContent=on?'En pedido':'Agregar';});}
function thumb(p){var u=(p.imgs&&p.imgs[0])||p.img; return u?'<img src="'+esc(u)+'" alt="">':'<img alt="">';}
function pr(p){return p.colab||p.pvp;}
function sendWA(codes){codes=codes.filter(function(c){return BY[c];}); if(!codes.length){toast('Tu pedido está vacío');return;}
  var tot=0, L=codes.map(function(c){var p=BY[c], q=cart[c]||1; tot+=pr(p)*q; return '• '+q+' x '+p.nombre+' ('+c+') — '+money(pr(p))+' c/u';});
  var msg='Hola Steren, soy colaborador(a) y quiero pedir del catálogo para colaboradores:\n'+L.join('\n')+'\nTotal: '+money(tot)+' (precio colaborador, incluye IVA)\nMi nombre: \nMi tienda o ciudad: ';
  window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(msg),'_blank');}
function openCart(){var ks=Object.keys(cart).filter(function(c){return BY[c];}), tot=0;
  document.getElementById('clist').innerHTML=ks.length?ks.map(function(c){var p=BY[c]; tot+=pr(p)*cart[c]; return '<div class="pi" data-to="'+esc(c)+'">'+thumb(p)+'<div class="t">'+esc(p.nombre)+'<small>'+esc(c)+' · '+money(pr(p))+' c/u</small></div><div class="qty" data-c="'+esc(c)+'"><button data-d="-1">−</button><b>'+cart[c]+'</b><button data-d="1">+</button></div></div>';}).join(''):'<div class="empty">Aún no agregas productos.<br>Toca «Agregar» en los que te gusten.</div>';
  document.getElementById('ctot').innerHTML=ks.length?'<span>Total con IVA</span><span>'+money(tot)+'</span>':'';
  var b=document.getElementById('csend'); b.innerHTML=waico+'Enviar pedido por WhatsApp'; b.style.display=ks.length?'':'none';
  document.getElementById('pcart').classList.add('on');}
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
var SYN={parlante:['bocina','bafle','parlante'],parlantes:['bocina','bafle','parlante'],audifono:['audifono','auricular'],audifonos:['audifono','auricular'],powerbank:['power bank','powerbank','bateria'],reloj:['reloj','smartwatch'],foco:['foco','lampara','bombilla'],camara:['camara','webcam'],microfono:['microfono'],microfonos:['microfono'],teclado:['teclado'],mouse:['mouse','raton'],cable:['cable']};
function doSearch(){var q=norm(document.getElementById('q').value.trim()), w=q.split(/\s+/).filter(Boolean);
  var r=w.length?P.filter(function(p){var h=norm(p.nombre+' '+p.codigo+' '+p.cat+' '+(p.feat||[]).join(' ')); return w.every(function(x){return (SYN[x]||[x]).some(function(y){return h.indexOf(y)>=0;});});}):P;
  document.getElementById('sres').innerHTML=r.length?r.slice(0,60).map(function(p){return '<button class="pi" data-to="'+esc(p.codigo)+'">'+thumb(p)+'<div class="t">'+esc(p.nombre)+'<small>'+esc(p.codigo)+' · '+esc(p.cat)+'</small></div><span class="p">'+money(pr(p))+'</span></button>';}).join(''):'<div class="empty">No encontramos productos con «'+esc(q)+'».</div>';}
function openSearch(){document.getElementById('psearch').classList.add('on'); doSearch(); setTimeout(function(){document.getElementById('q').focus();},50);}
document.getElementById('q').addEventListener('input',doSearch);
upd();
function toast(m){var t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); setTimeout(function(){t.classList.remove('on');},1600);}
document.addEventListener('click',function(e){
  if(e.target.closest('[data-close]')){e.target.closest('.panel').classList.remove('on');return;}
  if(e.target.closest('#bsearch')||e.target.closest('.find')){openSearch();return;}
  if(e.target.closest('#bcart')){openCart();return;}
  if(e.target.closest('#csend')){sendWA(Object.keys(cart));return;}
  var qb=e.target.closest('.qty button'); if(qb){var cd=qb.parentNode.getAttribute('data-c'); cart[cd]=(cart[cd]||0)+(+qb.getAttribute('data-d')); if(cart[cd]<=0) delete cart[cd]; saveCart(); openCart(); return;}
  var pi=e.target.closest('.pi[data-to]'); if(pi){document.getElementById('psearch').classList.remove('on');document.getElementById('pcart').classList.remove('on');var el=feed.querySelector('.post[data-code="'+pi.getAttribute('data-to').replace(/"/g,'\\"')+'"]'); if(el) el.scrollIntoView(); return;}
  var t=e.target.closest('[data-go]'); if(t){go(t.getAttribute('data-go'));return;}
  var post=e.target.closest('.post'); if(!post) return;
  var dot=e.target.closest('.dots i'); if(dot){var s=post.querySelector('.slides'); s.scrollTo({left:s.clientWidth*(+dot.getAttribute('data-k')),behavior:'smooth'}); return;}
  if(e.target.closest('.more')){post.classList.add('open'); return;}
  if(e.target.closest('.close')){post.classList.remove('open'); return;}
  var code=post.getAttribute('data-code');
  if(e.target.closest('.add')){if(cart[code]) delete cart[code]; else cart[code]=1; saveCart(); toast(cart[code]?'Agregado a tu pedido':'Quitado de tu pedido'); return;}
  if(e.target.closest('.want')){sendWA([code]); return;}
  if(e.target.closest('.share')){var name=post.querySelector('.name').textContent; var url=location.href.split('#')[0]+'#'+post.id; var txt=name+' ('+code+') en el catálogo Steren para colaboradores';
    if(navigator.share){navigator.share({title:name,text:txt,url:url}).catch(function(){});} else {window.open('https://wa.me/?text='+encodeURIComponent(txt+' '+url),'_blank');} return;}
  if(e.target.closest('.cats')){feed.scrollTo({top:0,behavior:'smooth'}); return;}
});
var hint=document.getElementById('hint');
var io=new IntersectionObserver(function(es){es.forEach(function(en){
  if(!en.isIntersecting) en.target.classList.remove('open');
  if(en.isIntersecting&&en.intersectionRatio>.6){
  var c=en.target.getAttribute('data-cat'); [].forEach.call(chips.children,function(ch){var on=ch.getAttribute('data-go')===c; ch.classList.toggle('on',on); if(on) ch.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});});
  if(en.target.id) hint.style.display='none';
}});},{root:feed,threshold:[0,.6]});
[].forEach.call(feed.children,function(s){io.observe(s);});
if(location.hash){var t=document.getElementById(location.hash.slice(1)); if(t) setTimeout(function(){t.scrollIntoView();},50);}
})();
</script>
