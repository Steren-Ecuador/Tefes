<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TEFES · Asesores</title>
<!-- TEFES · ENTORNO DE PRUEBAS · MAQUETA DEL PANEL DE ASESORES (estilo redes sociales), 2026-10-31.
     Página independiente con datos de ejemplo. Lo que se registra queda solo en este navegador. -->
<style>
:root{--brand:#0078be;--brand2:#005a8f;--ok:#1a7f4b;--bad:#c0352b;--warn:#b26a00;--muted:#5d6b7a;--line:#e2e7ee;--bg:#f3f5f8;--card:#fff;--oro:#d4a017;--plata:#9aa4ae;--bronce:#b8733a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:#16202b;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
button,input,select,textarea{font:inherit}
.prueba{font-size:11px;color:#9aa4ae;text-align:right;padding:2px 10px;background:#fff}
header{background:var(--brand);color:#fff;padding:12px 16px 14px;position:sticky;top:0;z-index:20}
.cab{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none}
.cab .av{border:2px solid #fff}
.cab b{display:block;font-size:17px}
.cab span{font-size:13px;opacity:.85}
main{padding:12px 12px 96px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,32,48,.06)}
h3{margin:0 0 8px;font-size:16px}
.muted{color:var(--muted)}.tiny{font-size:12px}.small{font-size:13px}
.fila{display:flex;align-items:center;justify-content:space-between;gap:8px}
/* historias */
.hist{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 10px;margin:0 -2px 6px;scrollbar-width:none}
.hist::-webkit-scrollbar{display:none}
.st{flex:none;width:66px;text-align:center;background:none;border:0;padding:0;cursor:pointer}
.ring{width:62px;height:62px;border-radius:50%;padding:3px;margin:0 auto 4px;position:relative}
.ring .av{width:100%;height:100%;border:2px solid #fff;font-size:17px}
.st small{display:block;font-size:11.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st em{font-style:normal;font-size:11px;color:var(--muted)}
.st .pct{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);background:#fff;border-radius:9px;font-size:10.5px;font-weight:800;padding:0 5px;box-shadow:0 1px 2px rgba(0,0,0,.15)}
/* barra */
.bar{height:10px;border-radius:6px;background:#e7ecf2;position:relative;overflow:hidden;margin:8px 0 4px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--brand)}
.bar i.ok{background:var(--ok)}.bar i.warn{background:var(--warn)}
.bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:#16202b;opacity:.55}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.kpis div{background:var(--bg);border-radius:10px;padding:8px}
.kpis b{display:block;font-size:18px}
/* ranking */
.podio{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin:8px 0 10px;text-align:center}
.podio .av{width:52px;height:52px;margin:0 auto 4px;font-size:16px}
.podio .p1 .av{width:64px;height:64px;font-size:19px}
.podio .base{border-radius:10px 10px 0 0;color:#fff;font-weight:800;padding:6px 0}
.podio .p1 .base{background:var(--oro);height:58px}.podio .p2 .base{background:var(--plata);height:42px}.podio .p3 .base{background:var(--bronce);height:30px}
.podio small{display:block;font-size:12px;font-weight:700}
.rk{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.rk .n{width:20px;text-align:center;font-weight:800;color:var(--muted)}
.rk .av{width:34px;height:34px;font-size:13px}
.rk .q{flex:1;min-width:0}
.rk .q b{display:block;font-size:14px}
.rk .q .small b,.rk .q .tiny b{display:inline;font-size:inherit}
.rk .v{text-align:right;font-weight:800}
.rk.yo{background:#eaf4fb;border-radius:10px;padding-left:6px;padding-right:6px;border-top-color:transparent}
.seg{display:flex;background:#e7ecf2;border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:8px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 2px rgba(0,0,0,.08)}
/* publicaciones */
.post .pc{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.post .pc .av{width:38px;height:38px;font-size:14px}
.post .pc b{display:block;font-size:14px}
.post .txt{margin:0 0 10px}
.post .big{font-size:22px;font-weight:800;margin:2px 0 6px}
.acc{display:flex;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.acc button{flex:1;border:0;background:none;border-radius:8px;padding:7px 4px;font-weight:700;color:var(--muted);cursor:pointer}
.acc button.on{color:var(--brand);background:#eaf4fb}
.chip{display:inline-block;font-size:11.5px;font-weight:700;border-radius:20px;padding:2px 8px;background:#e7ecf2;color:var(--muted)}
.chip.rojo{background:#fbe9e7;color:var(--bad)}.chip.amb{background:#fff4e0;color:var(--warn)}.chip.verde{background:#e5f4ec;color:var(--ok)}.chip.azul{background:#eaf4fb;color:var(--brand)}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.block{display:block;width:100%}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.btns .btn{padding:7px 10px;font-size:13px}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:10px 0 4px}
input.i,textarea.i,select.i{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
textarea.i{min-height:64px;resize:vertical}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* meta */
.grande{font-size:30px;font-weight:800;line-height:1.1}
.suma{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px;margin-top:6px}
.suma .t{border-top:1px solid var(--line);padding-top:6px;font-weight:800}
.anillo{width:150px;height:150px;border-radius:50%;margin:6px auto 8px;display:flex;align-items:center;justify-content:center}
.anillo div{width:118px;height:118px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.anillo b{font-size:28px}
/* horario */
.dia{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.dia:first-child{border-top:0}
.dia .d{width:46px;text-align:center}
.dia .d b{display:block;font-size:18px}
.dia .h{flex:1}
.dia.hoy{background:#eaf4fb;border-radius:10px;padding-left:8px;padding-right:8px;border-top-color:transparent}
.dia.libre .h{color:var(--muted)}
.seccion{margin-bottom:18px}
.sec-cab{font-size:20px;font-weight:900;margin:18px 2px 10px;display:flex;align-items:center;gap:6px}
.seccion:first-child .sec-cab{margin-top:4px}
/* navegación */
.com-foto{position:relative;border-radius:12px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:88px;margin:0 0 8px;overflow:hidden;background-size:cover;background-position:center}
.com-foto .tag{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px}
.reac{display:flex;gap:6px;flex-wrap:wrap}.reac button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 10px;font-size:13px;font-weight:700;cursor:pointer}.reac button.on{border-color:var(--brand);background:#e8f3fb;color:var(--brand)}
.coms{margin-top:8px;font-size:13px}.coms div{margin-top:3px}
.part{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.part .av{width:34px;height:34px;font-size:12px}.part .no{opacity:.3;filter:grayscale(1)}
.reto{background:linear-gradient(135deg,#ff7a59,#d6336c);color:#fff;border-radius:16px;padding:14px;margin-bottom:12px}.reto .btn{background:#fff;color:#d6336c;border:0}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:4px 2px calc(4px + env(safe-area-inset-bottom));z-index:30}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;min-height:50px;position:relative;cursor:pointer}
nav button.on{color:var(--brand);font-weight:800}
nav svg{width:25px;height:25px}
nav .dot{position:absolute;top:4px;left:50%;margin-left:8px;width:9px;height:9px;border-radius:50%;background:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:90vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#16202b;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:14px}
.vacio{text-align:center;padding:20px 10px;color:var(--muted)}
</style>
</head>
<body>
<div class="prueba">Prueba · maqueta del panel de asesores · datos de ejemplo · <a href="#" id="reiniciar" style="color:inherit">reiniciar</a></div>
<header><div class="cab"><span class="av" id="miAv"></span><div><b id="miNom"></b><span id="miSub"></span></div></div></header>
<main id="main"></main>
<nav id="nav">
  <button data-v="muro" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio<span class="dot" id="dMuro" hidden></span></button>
  <button data-v="com"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Comunidad<span class="dot" id="dCom" hidden></span></button>
  <button data-v="meta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>Mi meta</button>
  <button data-v="cli"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>Clientes<span class="dot" id="dCli" hidden></span></button>
  <button data-v="hor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Horario</button>
  <button data-v="apr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h7v14H4zM13 5h7v14h-7z"/></svg>Aprender<span class="dot" id="dApr" hidden></span></button>
</nav>
<div id="modal"></div>
<script>
(function(){
/* ================= DATOS DE EJEMPLO ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const usd0 = n => '$' + Math.round(n).toLocaleString('es-EC');
const usd2 = n => '$' + n.toLocaleString('es-EC', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const HOY = new Date(); HOY.setHours(12, 0, 0, 0);
const iso = d => d.toISOString().slice(0, 10);
const sumar = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const DIAS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const finMes = new Date(HOY.getFullYear(), HOY.getMonth() + 1, 0).getDate();
const diaMes = Math.max(HOY.getDate() - 1, 1);   // datos hasta ayer
const ritmo = diaMes / finMes;
const F = ritmo / (30 / 31);   // los ejemplos están hechos al 30 de octubre: se escalan al día de hoy
const fCorta = d => DIAS[d.getDay()].toLowerCase() + ' ' + d.getDate() + ' ' + MESES[d.getMonth()].slice(0, 3);

const TIENDA = {nombre: 'Mall Sol', presupuesto: 78000, mes: 71191 * F, ayer: 2295};
const COLORES = ['#0078be', '#7b4bc4', '#d0477a', '#1a8f7a', '#e07b16', '#3d5a80'];
const EQUIPO = [   // venta del mes (ERP referencial), meta personal (la reparte Diego), garantías del mes (POS)
  {id: 'rosa',    nombre: 'Rosa Intriago',   cargo: 'Asesor comercial', mes: 18420, ayer: 912,  meta: 19500, gar: 14, garUsd: 168.4},
  {id: 'maria',   nombre: 'María Herrera',   cargo: 'Asesor comercial', mes: 20180, ayer: 655,  meta: 19500, gar: 11, garUsd: 131.2},
  {id: 'joaquin', nombre: 'Joaquín Zambrano',cargo: 'Asesor comercial', mes: 15930, ayer: 1180, meta: 19500, gar: 19, garUsd: 224.9},
  {id: 'irene',   nombre: 'Irene Orellana',  cargo: 'Subgerente',       mes: 9861,  ayer: 210,  meta: 11700, gar: 6,  garUsd: 70.5},
  {id: 'bruno',   nombre: 'Bruno Lozada',    cargo: 'Gerente de tienda',mes: 6800,  ayer: 0,    meta: 7800,  gar: 3,  garUsd: 36.0}
];
EQUIPO.forEach(p => { p.mes *= F; p.garUsd *= F; p.gar = Math.max(Math.round(p.gar * F), 0); });
const YO = EQUIPO[0];
const SUELDO = {fijo: 470, pct: 0.015};   // ejemplo: en la app real sale de Sueldos y Comisiones (solo lo de cada uno). La comisión es sobre la venta TOTAL, garantía extendida incluida (Diego 2026-10-31)
const iniciales = n => n.split(' ').filter(Boolean).slice(0, 2).map(x => x[0]).join('').toUpperCase();
const colorDe = id => COLORES[EQUIPO.findIndex(p => p.id === id) % COLORES.length] || COLORES[0];
const miFoto = () => (typeof E !== 'undefined' && E.perfil && E.perfil.foto) || '';
const avatar = (p, cls) => (p === YO && miFoto()) ? '<span class="av ' + (cls || '') + '" style="background:#ddd url(' + miFoto() + ') center/cover"></span>'
  : '<span class="av ' + (cls || '') + '" style="background:' + colorDe(p.id) + '">' + iniciales(p.nombre) + '</span>';
const nombreCorto = n => n.split(' ')[0];

/* horario de la semana (ejemplo, en la app real sale del archivo de horarios de la tienda) */
const lunes = sumar(HOY, -((HOY.getDay() + 6) % 7));
const TURNOS = {rosa: ['10:00–19:00', '10:00–19:00', 'Libre', '12:00–21:00', '12:00–21:00', '10:00–19:00', 'Libre'],
  maria: ['12:00–21:00', 'Libre', '10:00–19:00', '10:00–19:00', 'Libre', '12:00–21:00', '11:00–20:00'],
  joaquin: ['Libre', '12:00–21:00', '12:00–21:00', 'Libre', '10:00–19:00', '11:00–20:00', '11:00–20:00'],
  irene: ['10:00–19:00', '10:00–19:00', '10:00–19:00', '12:00–21:00', '12:00–21:00', 'Libre', 'Libre'],
  bruno: ['12:00–21:00', '12:00–21:00', 'Libre', '10:00–19:00', '10:00–19:00', '10:00–19:00', '11:00–20:00']};

/* estado guardado en el navegador */
const KEY = 'tefes_asesor_maqueta_v2';
const semilla = () => ({
  metaGanar: 0,
  aplausos: {},
  leidos: {},
  proformas: [
    {id: 'PF1', cliente: 'Carlos Mendoza', cel: '0991234567', productos: 'Kit 4 cámaras WiFi + DVR', monto: 389.9, contacto: iso(HOY), creada: iso(sumar(HOY, -3)), estado: 'Abierta', nota: 'Lo consulta con su esposa. Prefiere WhatsApp.'},
    {id: 'PF2', cliente: 'Ferretería La Unión', cel: '0987654321', productos: '20 extensiones + 10 multitomas', monto: 214.5, contacto: iso(sumar(HOY, -1)), creada: iso(sumar(HOY, -6)), estado: 'Abierta', nota: 'Pide factura a nombre de la empresa.'},
    {id: 'PF3', cliente: 'Andrea Paz', cel: '0961112233', productos: 'Bocina karaoke BOC-1450', monto: 129.9, contacto: iso(sumar(HOY, 2)), creada: iso(sumar(HOY, -1)), estado: 'Abierta', nota: ''},
    {id: 'PF4', cliente: 'Luis Vera', cel: '0975554433', productos: 'Videoportero CCTV-020', monto: 99.9, contacto: iso(sumar(HOY, -4)), creada: iso(sumar(HOY, -9)), estado: 'Compró', nota: ''}
  ],
  futuras: [
    {id: 'VF1', cliente: 'Patricia Gómez', cel: '0998887766', producto: 'CAR-150 Adaptador CarPlay inalámbrico', cant: 1, fecha: iso(sumar(HOY, -5)), estado: 'Llegó', nota: 'Llamar en la tarde.'},
    {id: 'VF2', cliente: 'Jorge Salas', cel: '0954443322', producto: 'DRON-200 Dron con cámara', cant: 1, fecha: iso(sumar(HOY, -2)), estado: 'Esperando', nota: ''}
  ]
});
let E = (() => { try { return Object.assign(semilla(), JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) { return semilla(); } })();
const guardar = () => { try { localStorage.setItem(KEY, JSON.stringify(E)); } catch (e) {} };
let vista = 'muro', segCli = 'pro', segRank = 'venta';

function toast(m){ document.querySelectorAll('.toast').forEach(t => t.remove()); const d = document.createElement('div'); d.className = 'toast'; d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
function abrir(h){ $('#modal').innerHTML = '<div class="modal"><div class="box">' + h + '</div></div>'; $('#modal .modal').onclick = e => { if (e.target.classList.contains('modal')) cerrar(); }; }
function cerrar(){ $('#modal').innerHTML = ''; }
const anillo = (pct, color) => 'conic-gradient(' + color + ' ' + Math.min(pct, 1) * 360 + 'deg, #e2e7ee 0)';

/* ================= INICIO (muro) ================= */
const ANUNCIOS = [
  {id: 'A1', de: 'Gerencia TEFES', titulo: 'Black Month DeUna: del 15 al 30 de noviembre', txt: 'Cashback para clientes que paguen con DeUna. Esta semana repasamos la guía en tienda.', fecha: sumar(HOY, -1)},
  {id: 'A2', de: 'Gerencia TEFES', titulo: 'Campaña de la semana: audio portátil', txt: 'Exhibir bocinas y audífonos en la entrada y ofrecer la garantía extendida en cada venta.', fecha: sumar(HOY, -4)}
];
function rankOrden(k){ return EQUIPO.slice().sort((a, b) => k === 'gar' ? b.gar - a.gar : (k === 'pct' ? b.mes / b.meta - a.mes / a.meta : b.mes - a.mes)); }
function renderMuro(){
  const hist = EQUIPO.map(p => { const c = p.mes / p.meta;
    return '<button class="st" data-per="' + p.id + '"><div class="ring" style="background:' + anillo(c, c >= ritmo ? 'var(--ok)' : 'var(--warn)') + '">' + avatar(p) + '<span class="pct">' + Math.round(c * 100) + '%</span></div><small>' + (p === YO ? 'Tú' : esc(nombreCorto(p.nombre))) + '</small><em>' + usd0(p.mes) + '</em></button>'; }).join('');
  const ct = TIENDA.mes / TIENDA.presupuesto, falta = Math.max(TIENDA.presupuesto - TIENDA.mes, 0), quedan = finMes - diaMes;
  const tienda = '<div class="card"><div class="fila"><h3 style="margin:0">' + esc(TIENDA.nombre) + ' en ' + MESES[HOY.getMonth()] + '</h3><span class="chip ' + (ct >= ritmo ? 'verde' : 'amb') + '">' + Math.round(ct * 100) + '% de la meta</span></div>' +
    '<div class="bar"><i class="' + (ct >= ritmo ? 'ok' : 'warn') + '" style="width:' + Math.min(ct, 1) * 100 + '%"></i><u style="left:' + ritmo * 100 + '%"></u></div>' +
    '<div class="kpis"><div><span class="tiny muted">Ayer</span><b>' + usd0(TIENDA.ayer) + '</b></div><div><span class="tiny muted">Mes</span><b>' + usd0(TIENDA.mes) + '</b></div><div><span class="tiny muted">Meta</span><b>' + usd0(TIENDA.presupuesto) + '</b></div></div>' +
    '<p class="small" style="margin:8px 0 0">' + (falta ? 'Entre todos faltan <b>' + usd0(falta) + '</b>' + (quedan > 0 ? ', unos <b>' + usd0(falta / quedan) + ' por día</b>.' : '.') : '¡Meta de la tienda cumplida! 🎉') + '</p></div>';
  const R = rankOrden(segRank), val = p => segRank === 'gar' ? p.gar + ' gar.' : segRank === 'pct' ? Math.round(p.mes / p.meta * 100) + '%' : usd0(p.mes);

/* ================= HORARIO ================= */
let horSel = null;
const hm = t => { const [h, m] = t.split(':').map(Number); return h * 60 + (m || 0); };
const tramo = t => t === 'Libre' ? null : t.split('–').map(hm);
const tipoTurno = t => { const r = tramo(t); return !r ? {ic: '🌴', n: 'Libre', c: '#1a8f7a', bg: '#e3f5ef'} : r[0] < 11 * 60 ? {ic: '☀️', n: 'Mañana', c: '#b26a00', bg: '#fff4e0'} : r[0] < 12 * 60 ? {ic: '🌤️', n: 'Media', c: '#0078be', bg: '#eaf4fb'} : {ic: '🌙', n: 'Tarde', c: '#5b3fa8', bg: '#efeafb'}; };
const durTxt = m => { const h = Math.floor(m / 60), r = Math.round(m % 60); return (h ? h + ' h' : '') + (h && r ? ' ' : '') + (r ? r + ' min' : (h ? '' : '0 min')); };
function renderHor(){
  const t = TURNOS.rosa, hoyI = (HOY.getDay() + 6) % 7; if (horSel == null) horSel = hoyI;
  const ahora = new Date(), mins = ahora.getHours() * 60 + ahora.getMinutes();
  const hoyT = t[hoyI], r = tramo(hoyT), tt = tipoTurno(hoyT);
  // próximo libre
  let prox = 0; for (let i = 1; i <= 14; i++) if (t[(hoyI + i) % 7] === 'Libre'){ prox = i; break; }
  const horas = t.reduce((s, x) => { const q = tramo(x); return s + (q ? (q[1] - q[0]) / 60 : 0); }, 0);
  // tarjeta de hoy
  let estado = '', pctT = 0;
  if (!r) estado = 'Hoy descansas. ¡Disfruta! 🌴';
  else if (mins < r[0]) estado = 'Entras en <b>' + durTxt(r[0] - mins) + '</b>';
  else if (mins < r[1]) { pctT = (mins - r[0]) / (r[1] - r[0]); estado = 'Te quedan <b>' + durTxt(r[1] - mins) + '</b> de turno 💪'; }
  else estado = 'Turno terminado. ¡Buen trabajo! 👏';
  const conHoy = EQUIPO.filter(p => p !== YO && TURNOS[p.id][hoyI] !== 'Libre');
  let h = '<div class="card" style="background:linear-gradient(135deg,' + (r ? '#0078be,#5b3fa8' : '#1a8f7a,#38b48b') + ');color:#fff">' +
    '<div class="fila"><span class="tiny" style="opacity:.85">HOY · ' + fCorta(HOY).toUpperCase() + '</span><span style="font-size:30px">' + tt.ic + '</span></div>' +
    '<div style="font-size:34px;font-weight:900;margin:2px 0">' + (r ? hoyT.replace('–', ' – ') : 'Libre') + '</div>' +
    '<div class="small">' + estado + '</div>' +
    (r ? '<div style="height:8px;border-radius:5px;background:rgba(255,255,255,.25);margin:10px 0 4px;overflow:hidden"><div style="height:100%;width:' + pctT * 100 + '%;background:#fff;border-radius:5px"></div></div>' : '') +
    (r && conHoy.length ? '<div style="display:flex;align-items:center;gap:6px;margin-top:10px"><span class="tiny" style="opacity:.85">Hoy con</span>' + conHoy.map(p => '<span class="av" style="width:30px;height:30px;font-size:11px;border:2px solid #fff;margin-left:-4px;background:' + colorDe(p.id) + '">' + iniciales(p.nombre) + '</span>').join('') + '</div>' : '') + '</div>';
  // chips resumen
  h += '<div class="kpis" style="margin:0 0 12px"><div style="background:#fff"><span class="tiny muted">Próximo libre</span><b>' + (t[hoyI] === 'Libre' ? 'Hoy 🌴' : prox ? (prox === 1 ? 'Mañana' : 'En ' + prox + ' días') : '—') + '</b></div>' +
    '<div style="background:#fff"><span class="tiny muted">Esta semana</span><b>' + horas + ' h</b></div>' +
    '<div style="background:#fff"><span class="tiny muted">Hora pico</span><b>18–20 🔥</b></div></div>';
  // tira de la semana
  h += '<div class="card"><h3>Mi semana</h3><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px">' + t.map((x, i) => { const d = sumar(lunes, i), k = tipoTurno(x), sel = i === horSel;
      return '<button data-hd="' + i + '" style="border:2px solid ' + (sel ? k.c : 'transparent') + ';background:' + k.bg + ';border-radius:12px;padding:6px 0;cursor:pointer;text-align:center' + (i === hoyI ? ';box-shadow:0 0 0 2px #fff inset' : '') + '">' +
        '<div class="tiny" style="color:' + k.c + ';font-weight:700">' + DIAS[d.getDay()] + '</div><div style="font-size:18px;font-weight:900">' + d.getDate() + '</div><div style="font-size:16px">' + k.ic + '</div>' +
        (i === hoyI ? '<div style="font-size:9px;font-weight:800;color:' + k.c + '">HOY</div>' : '<div style="font-size:9px">&nbsp;</div>') + '</button>'; }).join('') + '</div>' +
    '<div class="tiny muted" style="margin-top:8px">☀️ Mañana · 🌤️ Media · 🌙 Tarde · 🌴 Libre</div></div>';
  // quién está el día elegido: línea de tiempo 10:00–21:00
  const dSel = sumar(lunes, horSel), I = 10 * 60, F = 21 * 60, X = m => (m - I) / (F - I) * 100;
  const filas = EQUIPO.map(p => ({p: p, t: TURNOS[p.id][horSel]})).sort((a, b) => (tramo(a.t) || [9999])[0] - (tramo(b.t) || [9999])[0]);

    '<div style="position:relative;margin:12px 0 4px">' +
      filas.map(f => { const q = tramo(f.t), yo = f.p === YO;
        return '<div style="display:flex;align-items:center;gap:6px;height:36px;position:relative"><div style="width:54px;flex:none;font-size:12px;font-weight:' + (yo ? 800 : 600) + '">' + (yo ? 'Tú' : esc(nombreCorto(f.p.nombre))) + '</div>' +
          '<div style="flex:1;position:relative;height:22px"><div style="position:absolute;left:' + X(18 * 60) + '%;width:' + (X(20 * 60) - X(18 * 60)) + '%;top:-7px;bottom:-7px;background:#ffe9d6"></div>' + (q ? '<div style="position:absolute;left:' + X(q[0]) + '%;width:' + (X(q[1]) - X(q[0])) + '%;z-index:1;top:0;bottom:0;border-radius:11px;background:' + (yo ? 'var(--brand)' : colorDe(f.p.id) + '99') + ';color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;white-space:nowrap">' + f.t + '</div>'
            : '<div style="position:absolute;inset:0;display:flex;align-items:center;font-size:12px;color:var(--muted)">🌴 libre</div>') + '</div></div>'; }).join('') +
    '</div><div class="tiny muted">🔥 La franja naranja es la hora pico: de 18:00 a 20:00 entran más clientes.</div></div>';
  h += '<div class="tiny muted" style="text-align:center;margin:4px 0 8px">Lo arma tu gerente. Si ves un error, avísale.</div>';
  sec('hor').innerHTML = h;
  document.querySelectorAll('[data-hd]').forEach(b => b.onclick = () => { horSel = Number(b.dataset.hd); renderHor(); });
}

/* Política: se aprueba solo respondiendo bien TODAS sus preguntas (igual que en la app de la tienda; en la app real se guarda en "Lecturas de políticas") */
function politica(l){
  const r = {};
  const pinta = () => {
    abrir('<div class="tiny muted">' + l.id + ' · Política</div><h3 style="margin:2px 0 8px">' + l.ic + ' ' + esc(l.t) + '</h3><p class="small" style="line-height:1.5">' + esc(l.txt) + '</p>' +
      '<div class="tiny muted" style="margin:10px 0 6px;font-weight:700">RESPONDE PARA APROBAR</div>' +
      l.qs.map((q, i) => '<div style="margin-bottom:10px"><div class="small"><b>' + (i + 1) + '. ' + esc(q.q) + '</b></div>' +
        q.o.map((o, j) => '<button class="btn block" data-r="' + i + ':' + j + '" style="text-align:left;margin-top:5px;' + (r[i] === j ? 'border-color:var(--brand);background:#e8f3fb;color:var(--brand)' : '') + '">' + esc(o) + '</button>').join('') + '</div>').join('') +
      '<button class="btn pri block" id="polOk"' + (Object.keys(r).length < l.qs.length ? ' disabled style="opacity:.5"' : '') + '>Enviar respuestas</button>');
    document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { const [i, j] = b.dataset.r.split(':').map(Number); r[i] = j; pinta(); });
    $('#polOk').onclick = () => {
      if (Object.keys(r).length < l.qs.length) return;
      const mal = l.qs.filter((q, i) => r[i] !== q.ok).length;
      cerrar();
      if (!mal) { E.leidos[l.id] = new Date().toISOString(); guardar(); toast('🏆 ¡Aprobada! Quedó registrada con tu nombre.'); }
      else { E.fallos = E.fallos || {}; E.fallos[l.id] = (E.fallos[l.id] || 0) + 1; guardar(); toast('Tuviste ' + mal + ' respuesta' + (mal > 1 ? 's' : '') + ' mal. Vuelve a leerla e inténtalo otra vez.'); }
      render();
    };
  };
  pinta();
}

    document.querySelectorAll('[data-tm]').forEach(b => b.onclick = () => { D.tema = b.dataset.tm; D.txt = $('#pubTxt').value; pinta(); });
    if ($('#pubPer')) $('#pubPer').onchange = e => { D.permiso = e.target.checked; D.txt = $('#pubTxt').value; pinta(); };
    $('#pubOk').onclick = () => { if (!D.foto || !D.tema) return;
      E.posts.unshift({id: 'M' + Date.now(), tema: D.tema, foto: D.foto, txt: $('#pubTxt').value.trim() + (D.tema === 'reto' ? ' ' + RETO.tag : ''), f: iso(HOY)});
      try { guardar(); } catch (e) {}
      cerrar(); toast(E.posts.length === 1 ? '📸 ¡Primera foto! Ganaste tu primera insignia.' : '¡Publicado! Tu equipo ya lo puede ver.'); render(); ir('com'); };
  };
  pinta();
}

/* ================= navegación: todo en un solo scroll, como Instagram ================= */
const SECCIONES = [['muro', '🏠 Inicio', renderMuro], ['com', '📸 Comunidad', renderCom], ['meta', '🎯 Mi meta', renderMeta], ['cli', '👥 Mis clientes', renderCli], ['hor', '📅 Mi horario', renderHor], ['apr', '🎓 Aprender', renderApr]];
const sec = id => document.getElementById('s-' + id);
$('#main').innerHTML = SECCIONES.map(([id, t]) => '<section id="w-' + id + '" class="seccion"><div class="sec-cab">' + t + '</div><div id="s-' + id + '"></div></section>').join('');
function render(){
  $('#dMuro').hidden = !ANUNCIOS.some(a => !E.leidos[a.id]);
  $('#dCli').hidden = !porContactar();
  $('#dApr').hidden = !LECTURAS.some(l => !E.leidos[l.id]);
  $('#dCom').hidden = publicaron().has(YO.id);
  SECCIONES.forEach(([id, , fn]) => fn());
}
const marcar = v => document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x.dataset.v === v));
const ir = v => { const el = document.getElementById('w-' + v); if (!el) return; const y = el.getBoundingClientRect().top + window.scrollY - document.querySelector('header').offsetHeight - 4; window.scrollTo({top: y, behavior: 'smooth'}); marcar(v); };
document.querySelectorAll('nav button').forEach(b => b.onclick = () => ir(b.dataset.v));
// el menú de abajo sigue la sección que se está viendo
window.addEventListener('scroll', () => { const top = window.innerHeight * 0.4; let act = 'muro';
  SECCIONES.forEach(([id]) => { const el = document.getElementById('w-' + id); if (el && el.getBoundingClientRect().top <= top) act = id; });
  if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 4) act = 'apr';
  marcar(act); }, {passive: true});
pintarCab(); $('#miAv').style.cursor = 'pointer'; $('#miAv').onclick = () => bienvenida(true); $('#miSub').textContent = YO.cargo + ' · Steren ' + TIENDA.nombre;
$('#reiniciar').onclick = e => { e.preventDefault(); localStorage.removeItem(KEY); E = semilla(); pintarCab(); render(); bienvenida(); };
render();
if (!E.perfil || !E.perfil.foto) bienvenida();
const q = new URLSearchParams(location.search).get('v'); if (q && SECCIONES.some(x => x[0] === q)) setTimeout(() => ir(q), 50);
})();
</script>
