<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Steren · Colaboradores Corporación Favorita</title>
<meta name="description" content="Productos Steren con precio especial para colaboradores de Corporación Favorita y filiales. Precios incluyen IVA.">
<meta name="theme-color" content="#001d38">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#002f57;--deep:#001d38;--fg:#fff;--muted:rgba(255,255,255,.75);--chip:rgba(255,255,255,.14);--accent:#00b2e3;--accent-fg:#fff;--blue:#0093d0;--buy:#c74b00;--card:#fff;--hd:calc(env(safe-area-inset-top) + 92px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font:15px/1.35 Heebo,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{overflow:hidden}
.app{position:relative;height:100%;max-width:480px;margin:0 auto;background:var(--deep);overflow:hidden}
@media(min-width:520px){.app{border-left:1px solid #0b3a66;border-right:1px solid #0b3a66}}
/* Encabezado fijo */
.top{position:absolute;top:0;left:0;right:0;z-index:20;height:var(--hd);padding-top:calc(env(safe-area-inset-top) + 8px);background:var(--deep);border-bottom:3px solid var(--blue)}
.brand{display:flex;align-items:center;justify-content:center;gap:8px;height:34px}
.brand img{height:26px;width:auto}
.brand b{font-size:22px;font-weight:800;letter-spacing:.3px}
.brand span{font-size:12px;color:var(--muted);font-weight:600;border-left:1px solid #fff4;padding-left:8px;line-height:1.15}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:var(--chip);color:var(--fg);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--blue);color:#fff}
/* Feed vertical */
.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
.feed::-webkit-scrollbar{display:none}
.post{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;display:flex;flex-direction:column;padding-top:var(--hd)}
.bgblur{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(40px) brightness(.35) saturate(1.2);transform:scale(1.1)}
/* Zona de foto: nunca lleva texto encima */
.stage{position:relative;flex:1 1 auto;min-height:0;container-type:size;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px 0 4px}
.card{position:relative;width:min(86vw,46vh,400px);width:min(100cqw - 32px,100cqh - 26px,400px);aspect-ratio:1;background:var(--card);border-radius:22px;box-shadow:0 16px 40px #0008;overflow:hidden}
.slides{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.slides::-webkit-scrollbar{display:none}
.slides img{flex:0 0 100%;width:100%;height:100%;object-fit:contain;scroll-snap-align:center;padding:4%}
.noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#555;font-weight:700;font-size:22px;padding:20px;text-align:center}
.dots{display:flex;gap:7px;height:8px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:#fff5;cursor:pointer;transition:all .2s}
.dots i.on{background:#fff;width:18px;border-radius:4px}
/* Zona de texto, debajo de la foto */
.info{position:relative;z-index:5;display:flex;gap:10px;padding:6px 10px calc(env(safe-area-inset-bottom) + 14px) 14px}
.txt{flex:1;min-width:0}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-bottom:2px}
.name{font-size:17px;font-weight:800;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.code{font-size:12px;color:var(--muted);font-weight:600;margin:2px 0 4px}
.feat{list-style:none;color:var(--muted);font-size:13.5px;line-height:1.35;max-height:2.7em;overflow:hidden}
.feat li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat li::before{content:"• ";color:var(--accent)}
.more{background:none;border:0;color:var(--fg);font-weight:700;font-size:13px;padding:2px 0 6px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.price{display:flex;align-items:stretch;gap:10px;margin-top:4px}
.pcol{background:var(--blue);color:var(--accent-fg);border-radius:12px;padding:6px 12px 7px;line-height:1}
.pcol small{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.pcol strong{font-size:30px;font-weight:900;letter-spacing:-.5px}
.pnorm{display:flex;flex-direction:column;justify-content:center;font-size:12px;color:var(--muted);line-height:1.25}
.pnorm s{font-size:16px;font-weight:700}
.pvp{font-size:26px;font-weight:900}
.iva{font-size:11.5px;color:var(--muted);margin-top:5px}
.iva b{color:var(--fg)}
.top .tb{position:absolute;top:calc(env(safe-area-inset-top) + 8px);width:34px;height:34px;border:0;background:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.top .tb svg{width:24px;height:24px}
.top .tb.l{left:8px}.top .tb.r{right:8px}
.badge{position:absolute;top:0;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--buy);color:#fff;font-size:11px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 4px}
.badge.on{display:flex}
.save{color:var(--accent);font-weight:700;font-size:12px}
.wa{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:8px;border:0;border-radius:12px;background:var(--buy);color:#fff;font-weight:800;font-size:15px;padding:10px 12px;cursor:pointer}
.wa svg{width:20px;height:20px}
.act.add.on svg{stroke:var(--accent)}
.act.add.on span{color:var(--accent)}
.panel{position:absolute;inset:0;z-index:40;background:#001d38f2;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 14px)}
.panel.on{display:flex}
.panel h2{font-size:18px;font-weight:800;margin:4px 40px 10px 0}
.panel .x{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:12px;width:34px;height:34px;border-radius:50%;border:0;background:#fff2;color:#fff;font-size:20px;cursor:pointer}
.panel input{width:100%;font-size:16px;padding:11px 14px;border-radius:12px;border:0;background:#fff;color:#000;margin-bottom:10px}
.plist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.pi{display:flex;align-items:center;gap:10px;background:#ffffff12;border-radius:12px;padding:8px;cursor:pointer;border:0;color:#fff;text-align:left;width:100%;font:inherit}
.pi img{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:8px;flex:0 0 auto}
.pi .t{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.25}
.pi .t small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.pi .p{font-weight:800;color:var(--accent);white-space:nowrap}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border-radius:50%;border:0;background:#fff2;color:#fff;font-size:16px;font-weight:800;cursor:pointer}
.qty b{min-width:18px;text-align:center}
.tot{display:flex;justify-content:space-between;font-size:16px;font-weight:800;padding:12px 2px 0;border-top:1px solid #fff3;margin-top:8px}
.tot:empty{display:none}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.city{display:flex;gap:6px;margin-bottom:10px}
.lv{font-size:12px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}
.lv2{background:#25d36633;color:#4ee38a}.lv1{background:#ffb02033;color:#ffc04d}.lv0{background:#ffffff1a;color:#fff8}
.waS{border:0;border-radius:10px;background:#25d366;color:#05210f;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.waS svg{width:22px;height:22px}.waS[disabled]{background:#ffffff1a;color:#fff6}
.pnote{color:var(--muted);font-size:12px;margin-top:8px}
.rail{flex:0 0 auto;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;padding-bottom:6px}
.act{background:none;border:0;color:var(--fg);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;cursor:pointer}
.act svg{width:30px;height:30px}
.act.on svg{fill:#fe2c55;stroke:#fe2c55}
/* Ver más: panel que sí puede ir sobre la foto */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:15;max-height:78%;overflow-y:auto;background:#001d38f0;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:20px 20px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(105%);transition:transform .28s ease}
.post.open .sheet{transform:none}
.sheet h3{font-size:18px;font-weight:800;margin:0 30px 4px 0}
.sheet .code{margin-bottom:10px}
.sheet ul{list-style:none;font-size:15px;line-height:1.4}
.sheet li{margin-bottom:8px}
.sheet li::before{content:"• ";color:var(--accent)}
.close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;border:0;background:#fff2;color:#fff;font-size:18px;cursor:pointer}
.count{position:absolute;top:calc(var(--hd) + 10px);right:12px;z-index:6;font-size:12px;color:var(--muted);font-weight:600;background:#0006;padding:2px 8px;border-radius:999px}
.hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 6px);left:50%;transform:translateX(-50%);z-index:30;font-size:12px;color:var(--muted);animation:up 1.6s ease-in-out infinite;pointer-events:none}
@keyframes up{50%{transform:translate(-50%,-6px)}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fffe;color:#000;padding:8px 14px;border-radius:10px;font-weight:600;font-size:13px;opacity:0;transition:opacity .2s;z-index:50;pointer-events:none}
.toast.on{opacity:1}
.cover .stage{padding:0 24px;text-align:center;gap:14px}
.cover .big{width:84px;height:auto}
.cover h1{font-size:30px;line-height:1.1;font-weight:900}
.cover p{color:var(--muted);font-size:15px}
.cover .ivabox{display:inline-block;background:var(--blue);color:var(--accent-fg);font-weight:800;font-size:13px;padding:5px 12px;border-radius:999px}
.cover .cats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px}
.dbtns svg{width:18px;height:18px;vertical-align:-4px;margin-right:6px}
.dimg{width:100%;max-height:40vh;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:14px;margin:6px 0 12px}
.dname{font-size:18px;font-weight:700;margin:0 0 4px}.dcode{opacity:.7;font-size:13px;margin-bottom:10px}
.dprice{font-size:28px;font-weight:800;color:var(--accent)}.dpvp{opacity:.75;font-size:14px;margin:2px 0 12px}
.dfeat{font-size:14px;opacity:.9;padding-left:18px;margin:0 0 14px}.dbtns{display:flex;gap:8px;flex-wrap:wrap}
.dbtns button{flex:1 1 30%;min-width:96px;padding:12px 8px;border-radius:12px;border:0;font-weight:700;font-size:14px;background:#0b3a66;color:#fff}
.dbtns .dwant{background:var(--buy);color:#fff;flex-basis:100%}.dbtns .dadd.on{background:var(--blue);color:#fff}
#ptiendas{z-index:42}#pdet{z-index:41}#dbody{overflow-y:auto;flex:1;margin-top:40px}
.sh{font-size:13px;font-weight:700;opacity:.75;margin:14px 2px 6px;text-transform:uppercase;letter-spacing:.04em}
</style>
</head>

document.addEventListener('click',function(e){
