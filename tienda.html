<title>TEFES</title>
<style>
:root{

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}

<script>
/* Supervisión Tefes — registro de uso (se incluye en Index.html y Panel.html antes de </body>).
   Uso: REG.iniciar('tienda', TOKEN) o REG.iniciar('panel', PTOKEN); REG.quien(nombre); REG.vista('Tablero'); REG.ev('Ingreso', '').
   Solo cuenta tiempo activo: página visible y con actividad en los últimos 2 minutos. Envía cada 2 minutos y al salir. */
(function(){
  const PASO = 15, INACTIVO = 120, ENVIO = 120;
  const R = {tipo: '', cred: '', nombre: '', cola: [], seg: 0, vistaAct: '', vistaSeg: 0, ultimo: Date.now(), enviando: false,
    sesion: Math.random().toString(36).slice(2, 10),
    disp: (/iPad|Tablet/i.test(navigator.userAgent) ? 'Tablet' : /Mobi|Android|iPhone/i.test(navigator.userAgent) ? 'Celular' : 'Computadora') +
      (/iPhone|iPad/i.test(navigator.userAgent) ? ' iOS' : /Android/i.test(navigator.userAgent) ? ' Android' : /Windows/i.test(navigator.userAgent) ? ' Windows' : /Mac/i.test(navigator.userAgent) ? ' Mac' : '')};
  /* n: número correlativo de la sesión; el servidor descarta lo ya guardado si un envío se reintenta */
  let N = 0;
  const push = (ev, det, seg) => R.cola.push({ev: ev, det: String(det || ''), seg: seg || 0, t: Date.now(), n: ++N});
  /* Una fila por vista con su tiempo; en los envíos periódicos solo se manda si sumó tiempo */
  const cerrarVista = fin => { if (R.vistaAct && (fin || R.vistaSeg > 0)) push('Vista', R.vistaAct, R.vistaSeg); R.vistaSeg = 0; };
  function enviar(){
    if (!R.tipo || R.enviando) return;
    cerrarVista();
    if (R.seg > 0) { push('Tiempo', '', R.seg); R.seg = 0; }
    if (!R.cola.length) return;
    const lote = R.cola.splice(0, 50);
    R.enviando = true;
    try {
      const run = google.script.run.withSuccessHandler(() => { R.enviando = false; })
        .withFailureHandler(() => { R.enviando = false; R.cola = lote.concat(R.cola).slice(-200); });
      if (R.tipo === 'panel') run.apiRegistroPanel(R.cred, R.nombre, R.sesion, R.disp, lote);
      else run.apiRegistroTienda(R.cred, R.sesion, R.disp, lote);
    } catch (e) { R.enviando = false; }
  }
  ['click', 'keydown', 'touchstart', 'scroll'].forEach(n => window.addEventListener(n, () => { R.ultimo = Date.now(); }, {passive: true, capture: true}));
  setInterval(() => {
    if (document.visibilityState === 'visible' && Date.now() - R.ultimo < INACTIVO * 1000) { R.seg += PASO; R.vistaSeg += PASO; }
  }, PASO * 1000);
  setInterval(enviar, ENVIO * 1000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') enviar(); });
  window.addEventListener('pagehide', enviar);
  window.REG = {
    iniciar(tipo, cred){
      R.tipo = tipo; R.cred = cred;
      /* Si llegó desde el enlace del correo automático (&src=correo), el ingreso queda marcado "Desde el correo" */
      const ir = det => { R.src = det; if (tipo === 'tienda') { push('Ingreso', det); setTimeout(enviar, 3000); } };
      try { google.script.url.getLocation(l => ir(l && l.parameter && l.parameter.src === 'correo' ? 'Desde el correo' : '')); } catch (e) { ir(''); }
    },
    quien(nombre){ const n = String(nombre || ''); if (n && n !== R.nombre) { enviar(); R.nombre = n; push('Ingreso', R.src || ''); setTimeout(enviar, 3000); } else if (!n) { enviar(); R.nombre = ''; } },
    vista(nombre){ nombre = String(nombre || ''); if (nombre === R.vistaAct) return; cerrarVista(true); R.vistaAct = nombre; },
    ev(ev, det){ push(ev, det); },
    /* ux4: una fila por apertura: cuándo vio algo y cuánto tardaron los datos del servidor */
    carga(msPantalla, msDatos, guardado){ const s = ms => (Math.round(ms / 100) / 10).toFixed(1).replace('.', ',') + ' s';
      push('Carga', 'pantalla ' + s(msPantalla) + ' · datos ' + (msDatos == null ? 'sin respuesta' : s(msDatos)) + ' · ' + (guardado ? 'con datos guardados' : 'sin datos guardados') + ' · ' + R.disp); }
  };
})();
</script>

<script>
/* Informe de inventario en PDF, armado en el navegador hoja por hoja (igual que en el panel de Diego).
   Lo usan la página de la tienda (Index) y el panel de supervisores (Panel). */
function infHTML(f){
  const e = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const d = n => { const x = Math.abs(Number(n) || 0).toFixed(2).split('.'); return (n < 0 ? '−' : '') + '$' + x[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + x[1]; };
  const sg = n => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n);
  const M = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const fl = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || '')); return m ? (+m[3]) + ' de ' + M[+m[2] - 1] + ' de ' + m[1] : e(s); };
  const hh = s => { const m = /(\d{1,2}):(\d{2})/.exec(String(s || '')); if (!m) return e(s); const n = +m[1]; return (n % 12 || 12) + ':' + m[2] + ' ' + (n < 12 ? 'a.m.' : 'p.m.'); };
  const td = 'border:1px solid #bbb;padding:4px 6px;vertical-align:top', th = td + ';background:#eee;text-align:left;font-weight:700;color:#15202b;text-transform:none;letter-spacing:0;font-size:inherit;white-space:normal';
  const falt = f.items.filter(x => x.dif < 0), sobr = f.items.filter(x => x.dif > 0);
  const tabla = (L, conDesc) => `<table style="width:100%;border-collapse:collapse;font-size:10.5px;margin-top:4px"><thead><tr>
      <th style="${th}">Código</th><th style="${th}">Descripción</th><th style="${th};text-align:right">Sistema</th><th style="${th};text-align:right">Físico</th>
      <th style="${th};text-align:right">Dif.</th><th style="${th};text-align:right">PVP unit.</th><th style="${th};text-align:right">Total PVP</th><th style="${th}">Resolución</th></tr></thead><tbody>` +
    L.map(x => `<tr style="page-break-inside:avoid"><td style="${td};white-space:nowrap">${e(x.cod)}</td><td style="${td}">${e(x.desc)}</td><td style="${td};text-align:right">${e(x.sis)}</td><td style="${td};text-align:right">${e(x.cont)}</td>
      <td style="${td};text-align:right">${sg(x.dif)}</td><td style="${td};text-align:right">${d(x.pvp)}</td><td style="${td};text-align:right">${d(x.tot)}</td>
      <td style="${td}">${e(x.dec || '')}${conDesc ? (x.des ? '<br><b>Se descuenta</b>' : '<br>No se descuenta') : ''}</td></tr>`).join('') + '</tbody></table>';
  const firma = r => `<table style="width:100%;border-collapse:collapse;border:1px solid #bbb;font-size:11px"><tr><td style="padding:8px 10px;vertical-align:top"><b>${e(r.n)}</b><br><span style="color:#555">${e(r.c)}</span></td>
      <td style="padding:8px 10px;text-align:right;vertical-align:top;width:120px">Valor a descontar<br><b style="font-size:14px">${d(r.v)}</b></td></tr>
      <tr><td style="padding:30px 10px 8px"><div style="border-top:1px solid #333;padding-top:3px;font-size:10px">Firma · C.I.</div></td><td style="padding:30px 10px 8px"><div style="border-top:1px solid #333;padding-top:3px;font-size:10px">Fecha</div></td></tr></table>`;
  const v = x => x == null || x === '' ? '–' : e(x);
  const tb = (cab, filas, fs) => `<table style="width:100%;border-collapse:collapse;font-size:${fs || 10.5}px;margin-top:4px"><thead><tr>` +
    cab.map(c => `<th style="${th}${c[1] ? ';text-align:right' : ''}">${c[0]}</th>`).join('') + '</tr></thead><tbody>' +
    filas.map(r => '<tr style="page-break-inside:avoid">' + r.map((x, i) => `<td style="${td}${cab[i][1] ? ';text-align:right;white-space:nowrap' : ''}${i === 0 ? ';white-space:nowrap' : ''}">${x}</td>`).join('') + '</tr>').join('') + '</tbody></table>';
  const orig = f.orig || [], corr = f.corr || [], todos = f.todos || [];
  const sec1 = !f.orig ? '' : `<h3 style="font:700 14px Arial;margin:12px 0 2px">1. Diferencias del conteo de la tienda</h3>` + (orig.length ? tb([['Código'], ['Descripción'], ['Sistema', 1], ['1er conteo', 1], ['2do conteo', 1], ['Dif.', 1], ['Total PVP', 1], ['Explicación de la tienda']],
      orig.map(r => [e(r[0]), e(r[1]), v(r[2]), v(r[3]), v(r[4]), sg(r[5]), d(r[6]), e(r[7])])) : '<p style="margin:2px 0">La tienda no reportó diferencias.</p>');
  const sec2 = !f.corr ? '' : `<h3 style="font:700 14px Arial;margin:12px 0 2px">2. Correcciones de la revisión</h3>` + (corr.length ? tb([['Código'], ['Descripción'], ['Dif. tienda', 1], ['Recuento', 1], ['Dif. final', 1], ['Decisión'], ['Comentario']],
      corr.map(r => [e(r[0]), e(r[1]), r[2] == null || r[2] === '' ? '–' : sg(r[2]), v(r[3]), r[4] == null || r[4] === '' ? '–' : sg(r[4]), e(r[5]), e(r[6])])) : '<p style="margin:2px 0">Sin correcciones: quedan las diferencias como las reportó la tienda.</p>');
  /* anexo en bloques de 32 filas: cada hoja lleva su propia cabecera de columnas */
  const cabA = [['#', 1], ['Código'], ['Descripción'], ['Sistema', 1], ['1er', 1], ['2do', 1], ['Recuento', 1], ['Final', 1], ['Dif.', 1]];
  const filA = todos.map((r, i) => [i + 1, e(r[0]), e(r[1]), v(r[2]), v(r[3]), v(r[4]), v(r[5]), v(r[6]), r[7] == null || r[7] === '' ? '–' : r[7] === 0 ? '0' : '<b>' + sg(r[7]) + '</b>']);
  const bloques = []; for (let i = 0; i < filA.length; i += 32) bloques.push(filA.slice(i, i + 32));
  const anexo = !todos.length ? '' : bloques.map((B, k) => `<div${k ? ' data-cont' : ''} style="page-break-before:always"></div>` + (k === 0 ? `<h3 style="font:700 14px Arial;margin:0 0 2px">Anexo · Listado completo del conteo (${todos.length} productos)</h3>
    <p style="margin:0 0 4px;font-size:10px;color:#555">Todos los productos que debían contarse, con el registro de cada conteo. Final = cantidad física después de la revisión.</p>` :
    `<div data-cont style="font-size:10px;color:#555;margin:0 0 2px">${e(f.id)} · ${e(f.tienda)} · Anexo, continuación (hoja ${k + 1} de ${bloques.length})</div>`) + tb(cabA, B, 9.5).replace('<table', '<table data-anexo')).join('');
  const pares = []; for (let i = 0; i < f.reparto.length; i += 2) pares.push(f.reparto.slice(i, i + 2));
  const firmas = '<table style="width:100%;border-collapse:separate;border-spacing:0 8px">' + pares.map(p => `<tr style="page-break-inside:avoid"><td style="width:50%;padding-right:4px;vertical-align:top">${firma(p[0])}</td><td style="width:50%;padding-left:4px;vertical-align:top">${p[1] ? firma(p[1]) : ''}</td></tr>`).join('') + '</table>';
  return `<div style="width:720px;background:#fff;color:#15202b;font:12px/1.45 Arial,sans-serif">
  <table style="width:100%;border-collapse:collapse;border-bottom:2px solid #c8102e;margin-bottom:10px;font-size:10px;color:#666"><tr><td style="padding:0 0 6px">TEFES · Steren Ecuador</td><td style="padding:0 0 6px;text-align:right">${e(f.id)}</td></tr></table>
  <h1 style="font:700 22px Arial,sans-serif;margin:0 0 2px">Informe de inventario</h1>
  <div style="font-size:14px;margin-bottom:10px"><b>${e(f.tienda)}</b> · ${e(f.tipo)} · semana ${e(f.semana)}</div>
  <table style="width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px"><tr>
    <td style="${td}"><span style="color:#555">Fecha y hora del informe</span><br><b>${fl(f.fecha)}, ${hh(f.hora)}</b></td>
    <td style="${td}"><span style="color:#555">Elaboró</span><br><b>${e(f.elaboro)}</b><br>${e(f.cargoElab || '')}</td>
    <td style="${td}"><span style="color:#555">Líder de la tienda</span><br><b>${e(f.lider)}</b></td></tr>
    <tr><td style="${td}"><span style="color:#555">Productos revisados</span><br><b>${e(f.nProd)}</b> · exactitud ${e(f.exact)}</td>
    <td style="${td}"><span style="color:#555">Faltante al PVP</span><br><b style="color:#bf3328">${d(-f.falt)}</b> (${falt.length} productos)</td>
    <td style="${td}"><span style="color:#555">Sobrante al PVP</span><br><b>${d(f.sobr)}</b> (${sobr.length} productos)</td></tr></table>
  ${sec1}${sec2}
  <h3 style="font:700 14px Arial;margin:12px 0 2px">${f.orig ? '3. Resultado final · ' : ''}Faltantes</h3>${falt.length ? tabla(falt, true) : '<p style="margin:2px 0">Sin faltantes.</p>'}
  <h3 style="font:700 14px Arial;margin:12px 0 2px">${f.orig ? 'Resultado final · ' : ''}Sobrantes</h3>${sobr.length ? tabla(sobr, false) + '<p style="margin:4px 0 0;font-size:10.5px;color:#555">Los sobrantes se cargan a la tienda una vez confirmadas las cantidades; no reducen el faltante.</p>' : '<p style="margin:2px 0">Sin sobrantes.</p>'}
  <div style="page-break-inside:avoid;margin-top:14px;border:2px solid #15202b;border-radius:6px;padding:10px 12px">
    <table style="width:100%;border-collapse:collapse"><tr><td><b style="font-size:14px">Valor a descontar al personal (PVP)</b></td><td style="text-align:right"><b style="font-size:20px">${d(f.desc)}</b></td></tr></table>
    <div style="font-size:10.5px;color:#555;margin-top:2px">${e(f.regla || '')}</div>
    ${f.tol ? '<div style="margin-top:4px;font-weight:700">El faltante está dentro de la tolerancia de $10: no se descuenta.</div>' : ''}
  </div>
  ${f.obs ? `<p style="margin:10px 0 0"><b>Observaciones:</b> ${e(f.obs)}</p>` : ''}
  <div style="page-break-inside:avoid">
  <h3 style="font:700 14px Arial;margin:16px 0 4px">Aceptación del personal</h3>
  <p style="margin:0 0 8px;font-size:11px">Las personas que firmamos este informe declaramos que conocemos el resultado del inventario de ${e(f.tienda)} detallado arriba, que tuvimos la oportunidad de recontar y justificar las diferencias, y que aceptamos y autorizamos a TEFES a descontar de nuestra remuneración el valor indicado junto a nuestro nombre.</p>
  ${firmas}
  <table style="margin-top:34px;font-size:11px;border-collapse:collapse"><tr><td style="border-top:1px solid #333;padding-top:4px;width:240px">${e(f.elaboro)}<br>Elaboró</td><td style="width:40px"></td>
    <td style="border-top:1px solid #333;padding-top:4px;width:240px">Gerencia del Proyecto<br>Aprobó</td></tr></table></div>
  ${anexo}
</div>`;
}
function ipdfPaginar(f){
  const PH = 960;   // alto útil de una hoja A4 a 720 px (1040), con holgura: si el dibujo pasa la hoja, sale una hoja en blanco
  const host = document.createElement('div'); host.style.cssText = 'position:fixed;left:-10000px;top:0'; document.body.appendChild(host);
  const src = document.createElement('div'); src.innerHTML = infHTML(f); const root = src.firstElementChild;
  /* el anexo corre seguido: se juntan sus bloques y se quitan los saltos y rótulos de continuación (son para el PDF del servidor) */
  const ax = [...root.querySelectorAll('table[data-anexo]')];
  ax.slice(1).forEach(t => { [...t.tBodies[0].rows].forEach(r => ax[0].tBodies[0].appendChild(r)); t.remove(); });
  root.querySelectorAll('[data-cont]').forEach(x => x.remove());
  const nueva = () => { const p = host.appendChild(root.cloneNode(false));
    if (host.children.length > 1) p.insertAdjacentHTML('beforeend', '<div data-pie style="font-size:10px;color:#555;margin:0 0 6px;border-bottom:1px solid #ddd;padding-bottom:3px"></div>');
    return p; };
  let pag = nueva();
  const llena = () => [...pag.children].some(x => !x.hasAttribute('data-pie'));
  const cabe = () => pag.scrollHeight <= PH;
  const poner = el => { pag.appendChild(el); if (cabe() || pag.children.length === 1 || (pag.children.length === 2 && pag.firstElementChild.hasAttribute('data-pie'))) return;
    el.remove(); const prev = pag.lastElementChild, llevar = prev && /^H[1-6]$/.test(prev.tagName) ? prev : null;   // un título no queda solo al pie
    pag = nueva(); if (llevar) pag.appendChild(llevar); pag.appendChild(el); };
  [...root.children].forEach(el => {
    if (/page-break-before/.test(el.getAttribute('style') || '')) { if (llena()) pag = nueva(); return; }
    const filas = el.tagName === 'TABLE' && el.tBodies[0] ? [...el.tBodies[0].rows] : [];
    if (filas.length < 2) { poner(el); return; }
    let t = null;
    filas.forEach(tr => {
      if (t && t.parentNode === pag) { t.tBodies[0].appendChild(tr); if (cabe()) return; tr.remove(); }
      t = el.cloneNode(false); if (el.tHead) t.appendChild(el.tHead.cloneNode(true)); t.appendChild(document.createElement('tbody')); t.tBodies[0].appendChild(tr);
      poner(t);
    });
  });
  const n = host.children.length;
  host.querySelectorAll('[data-pie]').forEach((d, i) => { d.textContent = 'Informe de inventario ' + f.id + ' · ' + f.tienda + ' · ' + f.tipo + ' · hoja ' + (i + 2) + ' de ' + n; });
  return host;
}
let ipdfH2pP = null;
const ipdfH2p = () => ipdfH2pP = ipdfH2pP || new Promise((ok, ko) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
  s.onload = () => ok(window.html2pdf); s.onerror = () => { ipdfH2pP = null; ko(new Error('no cargó el generador de PDF')); }; document.head.appendChild(s); });
async function ipdfGenerar(f){
  const box = ipdfPaginar(f);
  try {
    const h2p = await ipdfH2p(), els = [...box.children];
    const opt = {margin: [10, 10, 12, 10], image: {type: 'jpeg', quality: 0.95}, html2canvas: {scale: 2, backgroundColor: '#ffffff', scrollX: 0, scrollY: 0, windowHeight: 1400},
      jsPDF: {unit: 'mm', format: 'a4'}, pagebreak: {mode: []}};
    const suelta = function(){ const o = this.prop.overlay; o.style.overflow = 'visible'; o.style.bottom = 'auto'; };
    let w = h2p().set(opt).from(els[0]).toContainer().then(suelta).toCanvas().toPdf();
    els.slice(1).forEach(el => { w = w.get('pdf').then(pdf => { pdf.addPage(); }).from(el).toContainer().then(suelta).toCanvas().toPdf(); });
    return await w.outputPdf('blob');
  } finally { box.remove(); }
}
function ipdfBajar(blob, nombre){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}

<script>
(function(){
const TOKEN = PORTAL.param('t');
const S = {data:null, vista:'inicio', filtro:'abiertos', form:null, subidas:{}, cola:[], activas:0, abiertoChat:{}, resp:{}};
const DRAFT_KEY = 'supSTEREN_' + TOKEN;

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = x => x == null || isNaN(x) ? '–' : Math.round(x * 100) + '%';
const iso = s => { s = String(s||'').trim(); let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return m[0]; m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m ? m[3] + '-' + m[2].padStart(2,'0') + '-' + m[1].padStart(2,'0') : ''; };
const DIAS_S = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'], MESES_S = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fmtH = h => { const m = String(h || '').match(/(\d{1,2}):(\d{2})/); if (!m) return ''; const n = +m[1]; return (n % 12 || 12) + ':' + m[2] + ' ' + (n < 12 ? 'a.m.' : 'p.m.'); };
const fmtF = (s, h) => { const i = iso(s); if (!i) return String(s || ''); const d = new Date(i + 'T12:00'); const t = h || (String(s).match(/\d{1,2}:\d{2}/) || [''])[0]; return DIAS_S[d.getDay()] + ' ' + d.getDate() + ' ' + MESES_S[d.getMonth()] + ' ' + d.getFullYear() + (t ? ' ' + fmtH(t) : ''); };
const fmtDT = d => { const p = n => String(n).padStart(2,'0'); return DIAS_S[d.getDay()] + ' ' + d.getDate() + ' ' + MESES_S[d.getMonth()] + ' ' + d.getFullYear() + ' ' + fmtH(p(d.getHours()) + ':' + p(d.getMinutes())); };
const sumarDias = (i, d) => { const t = new Date(i + 'T12:00:00'); t.setDate(t.getDate() + d); return t.toISOString().slice(0,10); };
const ahoraHM = () => new Date().toTimeString().slice(0,5);
const minDe = (a, b) => { const x = String(a||'').match(/(\d{1,2}):(\d{2})/), y = String(b||'').match(/(\d{1,2}):(\d{2})/); if (!x || !y) return null; const m = (+y[1]*60 + +y[2]) - (+x[1]*60 + +x[2]); return m >= 0 ? m : null; };
const fmtMin = m => m == null ? '–' : m < 60 ? m + ' min' : Math.floor(m/60) + ' h ' + String(m%60).padStart(2,'0') + ' min';
const fmtReloj = ms => { const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60, p = n => String(n).padStart(2,'0'); return (h ? h + ':' + p(m) : m) + ':' + p(x); };
const ABIERTOS = ['Pendiente','En proceso','Reabierto'];
const resultado = x => x >= 0.9 ? 'Óptimo' : x >= 0.71 ? 'Plan de trabajo' : 'Contención';
const tagEstado = e => '<span class="tag t-' + esc(String(e).split(' ')[0]) + '">' + esc(e) + '</span>';
function api(fn, ...args){
  return new Promise((ok, ko) => google.script.run.withSuccessHandler(ok).withFailureHandler(e => ko(e && e.message ? e : new Error(String(e))))[fn](TOKEN, ...args));
}
function toast(msg, ms){ document.querySelectorAll('.toast').forEach(t => t.remove()); const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), ms || 2600); }
function lsGet(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function lsSet(k, v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
let tGuardar = null;
function guardarBorrador(ya){ clearTimeout(tGuardar); if (ya) lsSet(DRAFT_KEY, S.form); else tGuardar = setTimeout(() => lsSet(DRAFT_KEY, S.form), 250); }

/* ---------- fotos: cámara o galería, reducción, sello y subida en segundo plano ---------- */
function reducirFoto(file, sello){
  return new Promise((ok, ko) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1280, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext('2d'); g.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      if (sello){
        const fs = Math.max(14, Math.round(c.width / 42)); g.font = '600 ' + fs + 'px -apple-system,Roboto,Arial,sans-serif';
        const w = g.measureText(sello).width + fs, hh = fs * 1.7;
        g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, c.height - hh, w, hh);
        g.fillStyle = '#fff'; g.textBaseline = 'middle'; g.fillText(sello, fs / 2, c.height - hh / 2);
      }
      ok(c.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); ko(new Error('No se pudo leer la foto')); };
    img.src = url;
  });
}
const pendientesDe = clave => (S.subidas[clave] || []);
const subiendoTotal = () => Object.values(S.subidas).reduce((n, l) => n + l.filter(x => !x.error).length, 0);
/** Encola fotos: se ven al instante y se suben de dos en dos mientras se sigue trabajando */
function encolarFotos(files, clave, nombre, cupo, sello, alTerminar){
  Array.from(files || []).slice(0, Math.max(0, cupo)).forEach(f => {
    const tmp = {id: Math.random().toString(36).slice(2), file: f, prev: URL.createObjectURL(f), clave, nombre, sello, alTerminar, error: false};
    (S.subidas[clave] = S.subidas[clave] || []).push(tmp);
    S.cola.push(tmp);
  });
  bombear();

function bombear(){

const ACCION_TL = {'Por validar':'envió la corrección para validar', 'Cerrado':'validó y cerró el pendiente', 'Reabierto':'lo devolvió a la tienda', 'En proceso':'mandó un avance', 'Pendiente':'lo dejó abierto', '':'escribió'};
function chat(hist){
  const ent = [];
  String(hist || '').split('\n').forEach(l => {
    const m = l.match(/^(\d{4}-\d{2}-\d{2})( \d{2}:\d{2})? · (.*)$/);
    if (m) ent.push({f: m[1], h: (m[2] || '').trim(), t: m[3]}); else if (ent.length) ent[ent.length - 1].t += '\n' + l;
  });
  if (!ent.length) return '<div class="tl-vacio">Sin movimientos todavía.</div>';
  return '<ol class="tl">' + ent.map(e => {
    let who = '', estado = null, txt = e.t, sup = false, m;
    if ((m = e.t.match(/^(Pendiente|En proceso|Por validar|Cerrado|Reabierto|Mensaje) \(([^)]+)\)(?::\s*([\s\S]*))?$/))) { estado = m[1] === 'Mensaje' ? '' : m[1]; sup = /supervisor$/i.test(m[2]); who = m[2].replace(/\s*·?\s*supervisor$/i, '') || 'Supervisor'; txt = (m[3] || '').trim(); }
    else if ((m = e.t.match(/^(Pendiente|En proceso|Por validar|Cerrado|Reabierto)(?::\s*([\s\S]*))?$/))) { estado = m[1]; sup = estado === 'Cerrado' || estado === 'Reabierto'; who = sup ? 'Supervisor' : 'La tienda'; txt = (m[2] || '').trim(); }
    else if ((m = e.t.match(/^Supervisor: ([\s\S]+)$/))) { estado = ''; sup = true; who = 'Supervisor'; txt = m[1]; }
    else if ((m = e.t.match(/^Creado por (.+)$/))) txt = m[1].trim() + ' registró el pendiente';
    const f = txt.match(/\s*\[(\d+) foto\(s\)\]$/); if (f) txt = txt.replace(f[0], '');
    const cuando = '<time>' + fmtF(e.f) + (e.h ? ' · ' + fmtH(e.h) : '') + '</time>';
    if (estado === null) return '<li class="ev"><i></i><div>' + esc(txt) + ' ' + cuando + '</div></li>';
    const accion = estado === 'En proceso' && !txt ? 'lo marcó en proceso' : ACCION_TL[estado];
    return '<li class="' + (sup ? 's' : 't') + '"><i></i><div><div class="tl-cab"><b>' + esc(who) + '</b>' + (sup && who !== 'Supervisor' ? ' (supervisor)' : '') + ' ' + accion + ' ' + cuando + '</div>' +
      (txt ? '<div class="tl-txt">' + esc(txt) + '</div>' : '') + (f ? '<div class="tl-foto">▣ ' + f[1] + ' foto' + (f[1] > 1 ? 's' : '') + '</div>' : '') + '</div></li>';
  }).join('') + '</ol>';
}

function relojCorrer(F){ if (F.reloj && !F.reloj.desde){ F.reloj.desde = Date.now(); F.reloj.ultimo = Date.now(); } }

function calcular(){
  const suma = {}, cnt = {}; let n = 0;
  S.data.puntos.forEach(p => { const it = S.form.items[p.id]; if(!it || it.calif == null) return; n++;
    if(it.calif === 'N/A') return; suma[p.sec] = (suma[p.sec]||0) + Number(it.calif); cnt[p.sec] = (cnt[p.sec]||0) + 1; });

  $('#fS').className = 'score res-' + (c.total == null ? '' : resultado(c.total).split(' ')[0]);

  S.data.secciones.forEach(s => { const e = $('#secp-' + s.cod); if(e) e.textContent = c.secs[s.cod] == null ? '' : pct(c.secs[s.cod]); });
  tkGate();
  const bar = $('#secbar');
  if (bar) {
    bar.innerHTML = S.data.secciones.map(s => { const ps = S.data.puntos.filter(p => p.sec === s.cod), hechos = ps.filter(p => S.form.items[p.id] && S.form.items[p.id].calif != null).length;
      return '<button data-sec="' + esc(s.cod) + '" class="' + (hechos === ps.length ? 'done' : '') + '"><b>' + esc(s.cod) + (c.secs[s.cod] != null ? ' · ' + pct(c.secs[s.cod]) : '') + '</b><span>' + hechos + '/' + ps.length + '</span></button>'; }).join('');
    bar.querySelectorAll('[data-sec]').forEach(b => b.onclick = () => { const t = $('#sec-' + b.dataset.sec); if (t) t.scrollIntoView({behavior:'smooth', block:'start'}); });
  }
}
function confirmarGuardar(){
  const F = S.form;
  if(!F.realizadaPor.trim()){ toast('Escribe quién realiza la supervisión'); window.scrollTo(0,0); return; }
  const malos = S.data.puntos.map(p => [p, faltaEn(p)]).filter(x => x[1]);
  if (malos.length) {
    const grupos = {}; malos.forEach(([p, f]) => (grupos[f] = grupos[f] || []).push(p.id));
    const txt = Object.keys(grupos).map(k => 'falta ' + k + ' en ' + grupos[k].slice(0, 4).join(', ') + (grupos[k].length > 4 ? '…' : '')).join('; ');
    toast(txt.charAt(0).toUpperCase() + txt.slice(1), 4500);
    const p0 = malos[0][0]; const it = F.items[p0.id]; if (it) it.abierto = true; pintarPunto(p0);
    $('#pt-' + p0.id).scrollIntoView({behavior:'smooth', block:'start'}); return;
  }
  const c = calcular(), np = Object.values(F.items).filter(i => i.calif==='0'||i.calif==='1').length;
  const min = Math.round(msReloj(F) / 60000);
  openModal('<h3>Guardar ' + esc(F.tipo.toLowerCase()) + '</h3>' +
    '<p class="muted small">' + esc(S.data.tienda) + ' · ' + fmtF(F.fecha) + ' · ' + esc(F.realizadaPor) + '</p>' +
    '<p style="font-size:28px;margin:6px 0" class="score res-' + resultado(c.total).split(' ')[0] + '">' + pct(c.total) + ' · ' + resultado(c.total) + '</p>' +
    '<p class="small">' + S.data.secciones.map(s => s.cod + ': <b>' + pct(c.secs[s.cod]) + '</b>').join(' · ') + '</p>' +
    '<p>Se crearán <b>' + np + '</b> pendientes para la tienda.</p>' +
    '<p class="small">⏱ Duración: <b>' + fmtMin(min) + '</b></p>' + tiemposHtml(F) +
    '<div class="row" style="margin-top:14px"><button class="btn ghost grow" id="mC">Revisar</button><button class="btn primary grow" id="mOk">Confirmar y guardar</button></div>');
  $('#mC').onclick = closeModal;
  $('#mOk').onclick = async () => {
    const b = $('#mOk'); b.disabled = true;
    if (subiendoTotal()) { b.innerHTML = '<span class="spin"></span> Subiendo ' + subiendoTotal() + ' foto(s)…'; await new Promise(r => { S.esperando = r; }); }
    const sinFoto = S.data.puntos.filter(p => faltaEn(p));
    if (sinFoto.length) { closeModal(); toast('Algunas fotos no subieron: ' + sinFoto.map(p => p.id).join(', ') + '. Reintenta y vuelve a guardar.', 5000); renderSup(); return; }
    b.innerHTML = '<span class="spin"></span> Guardando…';
    const ms = msReloj(F), tSec = {};
    Object.keys(F.tSec || {}).forEach(k => tSec[k] = Math.round(F.tSec[k] / 60000));
    const payload = {tipo:F.tipo, fecha:F.fecha, horaInicio:F.horaInicio, horaFin:ahoraHM(), realizadaPor:F.realizadaPor, gerente:F.gerente, subadmin:F.subadmin, personas:F.personas, comentario:F.comentario,
      duracionMin: Math.round(ms / 60000), tiempoSecciones: tSec,
      items: S.data.puntos.map(p => { const i = F.items[p.id]; return {id:p.id, calif:i.calif, obs:i.obs||'', dato:i.dato||'', fotos:fotosDe(i), accion:i.accion||'', responsable:i.responsable||'', fechaCompromiso:i.fechaCompromiso||'', prioridad:i.prioridad||''}; })};
    try {
      const r = await api('apiGuardarSupervisionTienda', payload);
      lsSet('supSTEREN_nombre', F.realizadaPor); lsSet(DRAFT_KEY, null); S.form = null; pintarReloj();
      S.data = await api('apiInitTienda'); if (!S.data) throw new Error('El servidor no devolvió datos de la tienda'); llenarPersonal(); lsSet('tiendaDatos_' + TOKEN, {t: Date.now(), d: S.data});
      closeModal();
      $('#footer').innerHTML = '';
      $('#main').innerHTML = '<div class="card" style="text-align:center;padding:28px 16px"><div style="font-size:40px">✅</div><h2 style="margin:6px 0">Supervisión guardada</h2>' +
        '<p class="score res-' + r.resultado.split(' ')[0] + '" style="font-size:26px;margin:6px 0">' + pct(r.total) + ' · ' + esc(r.resultado) + '</p>' +
        '<p class="muted">Se crearon ' + r.pendientes + ' pendientes · duró ' + fmtMin(Math.round(ms / 60000)) + '</p>' + (r.informe ? '<p><a href="' + esc(r.informe) + '" target="_blank" rel="noopener">Abrir informe PDF</a></p>' : '') + '<button class="btn primary" id="gP">Ver pendientes</button></div>';
      $('#gP').onclick = () => { S.filtro = 'abiertos'; irA('pend'); };
      $('#bPend').textContent = S.data.pendientes.filter(p => ABIERTOS.includes(p.estado)).length;
    } catch(e){ toast('No se guardó: ' + e.message + '. El borrador sigue en el teléfono.', 6000); b.disabled = false; b.textContent = 'Reintentar'; }
  };
}
function tiemposHtml(F){
  const t = F.tSec || {}, ks = S.data.secciones.map(s => s.cod).filter(k => t[k] > 0);
  if (!ks.length) return '';
  return '<div class="tiempos">' + ks.map(k => '<span>' + esc(k) + ' ' + fmtMin(Math.max(1, Math.round(t[k] / 60000))) + '</span>').join('') + '</div>';
}

/* ---------- HISTORIAL ---------- */
function histHtml(){
  const L = S.data.supervisiones;
  const color = v => v == null ? 'var(--na-soft)' : v >= 0.9 ? 'var(--ok)' : v >= 0.71 ? 'var(--warn)' : 'var(--bad)';
  const dur = s => s.min != null && !isNaN(s.min) ? s.min : minDe(s.ini, s.fin);
  const ds = L.map(dur).filter(x => x != null && x > 0);
  let h = '<div class="card"><h3 style="margin-top:0">Últimas supervisiones</h3>';
  if (ds.length) h += '<p class="small muted" style="margin-top:-2px">Duración promedio: <b style="color:var(--ink)">' + fmtMin(Math.round(ds.reduce((a, b) => a + b, 0) / ds.length)) + '</b></p>';
  if(!L.length) h += '<div class="empty">Todavía no hay supervisiones registradas.</div>';
  else h += '<div class="hist-l">' + L.map(s => { const m = dur(s); return '<div class="hist-i"><div><div class="small"><b>' + fmtF(s.fecha) + '</b> · ' + esc(s.tipo) + '</div>' +
      '<div class="tiny muted">' + esc(s.por) + (m ? ' · ⏱ ' + fmtMin(m) : '') + ' · ' + s.pend + ' pendientes</div>' +
      '<div class="hist-secs">' + s.secs.map((v,i) => '<i title="' + 'ABCDEF'[i] + ': ' + pct(v) + '" style="background:' + color(v) + '"></i>').join('') + '</div></div>' +
      '<div style="text-align:right"><div class="score res-' + esc(String(s.resultado).split(' ')[0]) + '" style="font-size:18px">' + pct(s.total) + '</div>' + (s.informe ? '<a class="small" href="' + esc(s.informe) + '" target="_blank" rel="noopener">PDF</a>' : '') + '</div></div>'; }).join('') + '</div>';
  h += '</div><p class="tiny muted">Verde ≥ 90% · Ámbar 71–89% · Rojo ≤ 70%</p>';
  return h;
}

/* ---------- modal ---------- */
function openModal(html){ $('#modal').innerHTML = '<div class="modal"><div class="box">' + html + '</div></div>'; $('#modal .modal').onclick = e => { if(e.target.classList.contains('modal')) closeModal(); }; }
function closeModal(){ $('#modal').innerHTML = ''; }

/* ---------- inicio ---------- */
function llenarPersonal(){
  const nombres = (S.data.personal || []).map(p => p.nombre);
  if (S.data.gerente && nombres.indexOf(S.data.gerente) < 0) nombres.unshift(S.data.gerente);
  $('#dlPersonal').innerHTML = nombres.map(n => '<option value="' + esc(n) + '"></option>').join('');
}
function setHH(){ document.documentElement.style.setProperty('--hh', document.querySelector('header').offsetHeight + 'px'); }
setHH(); window.addEventListener('resize', setHH);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && S.form) guardarBorrador(true); });
window.addEventListener('beforeunload', e => { if (S.form) guardarBorrador(true); if (subiendoTotal()) { e.preventDefault(); e.returnValue = ''; } });
if (window.REG) { REG.iniciar('tienda', TOKEN); REG.vista('Inicio'); }
// ux1: abre al instante con los últimos datos guardados en este equipo y se actualiza en segundo plano
const CACHE_KEY = 'tiendaDatos_' + TOKEN;
function enlaceSup(){
  // Enlace desde "Nueva supervisión" del panel (?sup=Nombre): abre Supervisar con ese nombre
  try { google.script.url.getLocation(l => { try { const n = l && l.parameter && String(l.parameter.sup || '').trim(); if (!n) return;
    lsSet('supSTEREN_nombre', n); const f = S.form || lsGet(DRAFT_KEY);
    if (f) { f.tipo = 'Supervisión'; f.realizadaPor = n; if (S.form) guardarBorrador(true); else lsSet(DRAFT_KEY, f); }
    irA('sup'); } catch(e){} }); } catch(e){}
}
(async function(){
  let guardado = null, toco = false;
  try { const c = lsGet(CACHE_KEY); if (c && c.d && c.d.hoy && Date.now() - c.t < 3 * 864e5) guardado = c.d; } catch(e){}
  const t0 = performance.now(); let tPant = null;   // ux4: medición de la carga
  const medir = ok => { try { if (window.REG) REG.carga(tPant == null ? performance.now() : tPant, ok ? performance.now() - t0 : null, !!guardado); } catch(e){} };
  if (guardado) { S.data = guardado; llenarPersonal(); render(); enlaceSup(); tPant = performance.now();
    const marcar = () => { toco = true; }; ['input', 'click', 'change'].forEach(ev => document.addEventListener(ev, marcar, {capture: true, once: true})); }
  try { const d = await api('apiInitTienda'); if (!d) throw new Error('El servidor no devolvió datos de la tienda');
    lsSet(CACHE_KEY, {t: Date.now(), d: d}); medir(true);
    if (!guardado) { S.data = d; llenarPersonal(); render(); enlaceSup(); return; }
    if (JSON.stringify(d) === JSON.stringify(guardado)) return;
    const poner = () => { S.data = d; llenarPersonal(); render(); };
    if (!toco && !$('#modal').innerHTML && !S.form) { poner(); return; }
    // Ya está trabajando: no le borramos lo que escribe; le ofrecemos actualizar
    const b = document.createElement('div'); b.className = 'nuevos';
    b.innerHTML = '<span>Hay cambios nuevos</span><button type="button">Actualizar</button>';
    b.querySelector('button').onclick = () => { b.remove(); poner(); };
    $('#main').prepend(b); }
  catch(e){ medir(false); if (guardado) toast('Sin conexión: se muestran los últimos datos guardados', 5000);
    else $('#main').innerHTML = '<div class="empty">No se pudo cargar: ' + esc(e.message) + '<br><br><button class="btn primary" onclick="location.reload()">Reintentar</button></div>'; }
})();
setTimeout(() => { if (!S.data) $('#main').innerHTML = '<div class="empty">La conexión está tardando más de lo normal. Revisa tu internet y vuelve a intentar.<br><br><button class="btn primary" onclick="location.reload()">Reintentar</button></div>'; }, 30000);
window.__S = S;
})();
</script>
<script>/* etiquetas de tiendas (Diego 2026-10-24): solo el nombre visible, la clave interna sigue igual */
(function(){
  var R=[[/\bMegakywi\b(?!-EloyAlfaro)/g,'Megakywi-EloyAlfaro'],[/\bMegamaxi\b(?! 6 Dic)/g,'Megamaxi 6 Dic']];
  var fix=function(s){return R.reduce(function(a,r){return a.replace(r[0],r[1]);},s);};
  var SKIP={SCRIPT:1,STYLE:1,TEXTAREA:1,INPUT:1};
  function walk(n){
    if(n.nodeType===3){ if(/Mega(kywi|maxi)/.test(n.nodeValue)){var v=fix(n.nodeValue); if(v!==n.nodeValue) n.nodeValue=v;} return; }
    if(n.nodeType!==1||SKIP[n.nodeName]) return;
    for(var c=n.firstChild;c;c=c.nextSibling) walk(c);
  }
  walk(document.body); var t=fix(document.title); if(t!==document.title) document.title=t;
  new MutationObserver(function(ms){ ms.forEach(function(m){ if(m.type==='characterData') walk(m.target); else m.addedNodes.forEach(walk); }); })
    .observe(document.body,{childList:true,subtree:true,characterData:true});
})();
</script>
