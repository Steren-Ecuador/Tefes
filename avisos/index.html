<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Avisos TEFES</title><meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="../stock/logo.png">
<style>
:root{--muted:rgba(255,255,255,.72);--chip:rgba(255,255,255,.14);--accent:#ffd400;--hd:calc(env(safe-area-inset-top) + 92px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#fff;font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{overflow:hidden}
.app{position:relative;height:100%;max-width:480px;margin:0 auto;background:#000;overflow:hidden}
@media(min-width:520px){.app{border-left:1px solid #222;border-right:1px solid #222}}
.top{position:absolute;top:0;left:0;right:0;z-index:20;height:var(--hd);padding-top:calc(env(safe-area-inset-top) + 8px);background:#000}
.brand{display:flex;align-items:center;justify-content:center;gap:8px;height:34px}
.brand img{height:26px}.brand b{font-size:22px;font-weight:800}
.brand span{font-size:12px;color:var(--muted);font-weight:600;border-left:1px solid #fff4;padding-left:8px;line-height:1.15}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 0;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:var(--chip);color:#fff;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:#fff;color:#000}
.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
.feed::-webkit-scrollbar{display:none}
.post{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;display:flex;flex-direction:column;padding-top:var(--hd)}
.glow{position:absolute;inset:-40px;filter:blur(60px);opacity:.35}
.stage{position:relative;flex:1 1 auto;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center;padding:10px 0 4px}
.card{width:min(100cqw - 32px,100cqh - 20px,400px);aspect-ratio:1;border-radius:22px;box-shadow:0 16px 40px #0008;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px}
.card .em{font-size:64px;line-height:1}
.card .big{font-size:76px;font-weight:900;letter-spacing:-2px;line-height:.95}
.card .sub{font-size:18px;font-weight:800;line-height:1.15}
.card .sm{font-size:14px;font-weight:600;opacity:.8}
.y{background:var(--accent);color:#111}.w{background:#fff;color:#111}.k{background:#1b1b1b;color:#fff;border:1px solid #333}.g{background:#25d366;color:#05210f}.b{background:#0078be;color:#fff}
.info{position:relative;z-index:5;padding:6px 14px calc(env(safe-area-inset-bottom) + 30px)}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-bottom:2px}
.tag.n{color:#4ee38a}
.name{font-size:19px;font-weight:800;line-height:1.2}
.when{font-size:12.5px;color:var(--muted);font-weight:600;margin:2px 0 6px}
.txt{color:var(--muted);font-size:14px;line-height:1.4}
.txt b{color:#fff}
.pill{display:inline-block;background:var(--accent);color:#111;font-weight:800;font-size:12px;padding:3px 10px;border-radius:999px;margin-top:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;border:0;border-radius:12px;font-weight:800;font-size:15px;padding:11px 12px;cursor:pointer;text-decoration:none}
.btn.wa{background:#25d366;color:#05210f}.btn.ye{background:var(--accent);color:#111}
.count{position:absolute;top:calc(var(--hd) + 10px);right:12px;z-index:6;font-size:12px;color:var(--muted);font-weight:600;background:#0006;padding:2px 8px;border-radius:999px}
.hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 6px);left:50%;transform:translateX(-50%);z-index:30;font-size:12px;color:var(--muted);animation:up 1.6s ease-in-out infinite;pointer-events:none}
@keyframes up{50%{transform:translate(-50%,-6px)}}
.list{position:absolute;inset:0;z-index:15;padding:var(--hd) 12px 20px;overflow-y:auto;display:none;background:#000}
.list.on{display:block}
.sh{font-size:13px;font-weight:800;color:var(--accent);margin:16px 2px 8px;text-transform:uppercase;letter-spacing:.05em}
.st{display:flex;align-items:center;gap:10px;background:#ffffff12;border-radius:14px;padding:12px;margin-bottom:8px}
.st .t{flex:1;min-width:0}.st .t b{font-size:16px;font-weight:800;display:block}
.st .t small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:2px}
.waS{border:0;border-radius:12px;background:#25d366;color:#05210f;width:46px;height:46px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;text-decoration:none}
.waS svg,.btn svg{width:22px;height:22px}
.pol{background:#ffffff12;border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.pol .id{font-size:11px;font-weight:800;color:var(--accent)}.pol b{display:block;font-size:16px;font-weight:800;margin:1px 0 3px}
.pol small{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.pol a{display:inline-block;margin-top:8px;background:var(--accent);color:#111;font-weight:800;font-size:13px;padding:6px 12px;border-radius:10px;text-decoration:none}
.intro{color:var(--muted);font-size:13px;margin:12px 2px 4px}
.x-draft{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:10px;z-index:25;font-size:10px;font-weight:800;background:var(--accent);color:#111;padding:2px 6px;border-radius:6px}

.more{background:none;border:0;color:#fff;font-weight:700;font-size:13px;padding:4px 0 0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.panel{position:absolute;inset:0;z-index:40;background:#000;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px)}
.panel.on{display:flex}.panel .x{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:12px;width:36px;height:36px;border-radius:50%;border:0;background:#fff2;color:#fff;font-size:20px;cursor:pointer}
.panel .body{flex:1;overflow-y:auto;margin-top:40px;font-size:15px;line-height:1.45;color:#eee}
.panel h2{font-size:20px;font-weight:800;margin:0 0 4px;color:#fff}.panel .id{font-size:12px;font-weight:800;color:var(--accent)}
.panel .pre{white-space:pre-wrap}
.panel h5{font-size:14px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 6px}
.panel p{margin:6px 0}.panel ul,.panel ol{padding-left:20px;margin:6px 0}.panel li{margin:4px 0}
.pol-lead{color:#fff;font-weight:600}
.pol-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.pol-costo,.pol-caso{background:#ffffff14;border-radius:12px;padding:10px;font-size:13px}
.pol-costo b{display:block;font-size:22px;color:var(--accent)}.pol-costo span{display:block;color:#ccc}
.gratis{background:#25d36626}.gratis b{color:#4ee38a}
.pol-flujo{display:grid;gap:6px;margin:8px 0}.pol-de,.pol-or{border-radius:10px;padding:8px 10px;font-size:13px}
.pol-de{background:#0078be33}.pol-or{background:#ffd40026}.pol-de b,.pol-or b{display:block}
.pol-tabla{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0}.pol-tabla th,.pol-tabla td{border:1px solid #333;padding:6px;text-align:left;vertical-align:top}.pol-tabla th{background:#ffffff14}
.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--muted);font-size:16px}

.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.kp div{background:#ffffff12;border-radius:14px;padding:12px}.kp small{display:block;color:var(--muted);font-size:12px}.kp b{font-size:22px;font-weight:900}
.bar{height:8px;border-radius:4px;background:#ffffff1f;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--accent)}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#ffffff12;border-radius:12px;padding:10px 12px;margin-bottom:6px;font-size:14px}
.row2 small{display:block;color:var(--muted);font-size:12px}
.bd{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}
.bd.r{background:#ff4d4f33;color:#ff8a8a}.bd.y{background:#ffd40033;color:var(--accent)}.bd.g{background:#25d36633;color:#4ee38a}
.mini{display:flex;gap:4px;margin-top:5px}.mini span{flex:1;height:5px;border-radius:3px;background:#ffffff1f;overflow:hidden}.mini span i{display:block;height:100%;background:var(--accent)}
.upd{font-size:11px;color:#fff6;text-align:center;margin:18px 0 6px}

async function dec(k,E){const b64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'=='.slice(0,(4-s.length%4)%4)),c=>c.charCodeAt(0));
 const key=await crypto.subtle.importKey('raw',b64(k),'AES-GCM',false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(E.iv)},key,b64(E.ct));const w={};new Function('window',new TextDecoder().decode(pt))(w);return w}
